<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Maestros — Gecatech</title>
<style>
  :root { --navy:#0b2a4a; --navy2:#123f63; --gold:#c9a227; --bg:#f2f4f7; --card:#fff; --text:#1c2733; --muted:#5b6b7a; --line:#dfe5ea; --ok:#1e7d4f; --err:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  header.top { background:var(--navy); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header.top img { height:44px; width:auto; background:#fff; border-radius:8px; padding:2px; }
  header.top h1 { font-size:19px; margin:0; }
  header.top small { color:#cfe0ee; display:block; font-size:12px; }
  header.top .spacer { flex:1; }
  header.top .user { font-size:13px; color:#cfe0ee; text-align:right; }
  button { background:var(--navy); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:15px; cursor:pointer; }
  button:hover { background:var(--navy2); }
  button.gold { background:var(--gold); color:#231f00; font-weight:600; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button.small { padding:6px 10px; font-size:13px; }
  button:disabled { opacity:.55; cursor:default; }
  input, select, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:15px; background:#fff; }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 4px; }
  .wrap { max-width:980px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin:14px 0; }
  .card h2 { margin:0 0 6px; font-size:18px; }
  .card p.hint { color:var(--muted); font-size:14px; margin:4px 0 10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:160px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 0; }
  .tabs button { background:#e8edf1; color:var(--navy); }
  .tabs button.active { background:var(--navy); color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:14px; margin-top:10px; }
  .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  @media (max-width:640px) {
    .students th:nth-child(2), .students td:nth-child(2),
    .students th:nth-child(3), .students td:nth-child(3) { display:none; }
    .students.show-all th:nth-child(2), .students.show-all td:nth-child(2),
    .students.show-all th:nth-child(3), .students.show-all td:nth-child(3) { display:table-cell; }
  }
  #btn-toggle-cols { display:none; }
  @media (max-width:640px) { #btn-toggle-cols { display:inline-block; } }
  th, td { border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; vertical-align:top; }
  th { color:var(--muted); font-size:12px; text-transform:uppercase; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .badge.admin { background:#fdeecb; color:#7a5c00; }
  .badge.teacher { background:#dcebf7; color:#0b2a4a; }
  .badge.off { background:#f3d9d7; color:#7a1f18; }
  .err { color:var(--err); font-size:14px; margin-top:8px; }
  .okmsg { color:var(--ok); font-size:14px; margin-top:8px; }
  .muted { color:var(--muted); font-size:13px; }
  .login-box { max-width:420px; margin:60px auto; }
  .login-box img { display:block; margin:0 auto 10px; max-width:220px; height:auto; }
  .login-box h1 { text-align:center; font-size:22px; margin:6px 0 2px; }
  .login-box p { text-align:center; color:var(--muted); font-size:14px; }
  .docline { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .docline a { color:var(--navy); }
  .hidden { display:none !important; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
</head>
<body>

<div id="view-login" class="wrap">
  <div class="card login-box">
    <img id="login-logo" alt="Gecatech">
    <h1>Portal Maestros</h1>
    <p>Acceso privado para maestros y administrador de Gecatech.</p>
    <label for="login-email">Correo</label>
    <input id="login-email" type="email" autocomplete="username" placeholder="tu@correo.com">
    <label for="login-pass">Contraseña</label>
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="Tu contraseña">
    <div style="margin-top:16px"><button id="btn-login" style="width:100%">Entrar</button></div>
    <div id="login-error" class="err"></div>
    <p class="muted">¿Olvidaste tu contraseña? Pídele al administrador que te ayude a restablecerla.</p>
  </div>
</div>

<div id="view-app" class="hidden">
  <header class="top">
    <img id="app-logo" alt="Gecatech">
    <div><h1>Portal Maestros</h1><small>Gecatech · Capacitación laboral</small></div>
    <div class="spacer"></div>
    <div class="user" id="user-chip"></div>
    <button class="ghost small" id="btn-logout">Salir</button>
  </header>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div id="section"></div>
  </div>
</div>

function calcGeneration(startDate, durationMonths) {
  if (!startDate) return "";
  const d = new Date(startDate + "T00:00:00");
  if (isNaN(d)) return "";
  d.setMonth(d.getMonth() + (durationMonths || 12));
  return d.getFullYear();
}
function monthRange(startDate) {
  // Grupos de mes desde el mes de inicio del curso hasta el mes actual (máx. 24).
  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  let list = [{y, m}];
  if (startDate) {
    const s = new Date(startDate + "T00:00:00");
    if (!isNaN(s)) {
      list = [];
      let cy = s.getFullYear(), cm = s.getMonth();
      let guard = 0;
      while ((cy < y || (cy === y && cm <= m)) && guard < 24) {
        list.push({y: cy, m: cm});
        cm++; if (cm > 11) { cm = 0; cy++; }
        guard++;
      }
      if (!list.length) list = [{y, m}];
    }
  }
  return list;
}

<script>

async function loadProfile(uid, email) {
  const doc = await db.collection("teachers").doc(uid).get();
  if (doc.exists) return { uid, ...doc.data() };
  if (email === ADMIN_EMAIL) {
    const allCourseIds = Object.keys(courses);
    const profile = { name: "Anghelo Carrillo", email, role: "admin", courses: allCourseIds, active: true };
    await db.collection("teachers").doc(uid).set(profile);
    return { uid, ...profile };
  }
  return null;
}
async function loadCourses() {
  const snap = await db.collection("courses").get();
  courses = {};
  snap.forEach(d => { courses[d.id] = d.data(); });
}
$("btn-login").addEventListener("click", async () => {
  const email = $("login-email").value.trim();
  const pass = $("login-pass").value;
  showErr($("login-error"), "");
  if (!email || !pass) { showErr($("login-error"), "Escribe tu correo y tu contraseña."); return; }
  $("btn-login").disabled = true;
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    await loadCourses();
    const profile = await loadProfile(cred.user.uid, cred.user.email);
    if (!profile) {
      await auth.signOut();
      showErr($("login-error"), "Tu cuenta no tiene perfil en el portal. Pídele al administrador que la active.");
      return;
    }
    if (profile.active === false) {
      await auth.signOut();
      showErr($("login-error"), "Tu cuenta está desactivada. Habla con el administrador.");
      return;
    }
    me = profile;
    enterApp();
  } catch (e) {
    const msg = (e.code === "auth/user-not-found" || e.code === "auth/wrong-password" || e.code === "auth/invalid-credential")
      ? "Correo o contraseña incorrectos." : "No se pudo entrar: " + (e.message || e.code);
    showErr($("login-error"), msg);
  } finally { $("btn-login").disabled = false; }
});
$("login-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-login").click(); });

  $("view-login").classList.add("hidden");

// ---------- Google Classroom (API oficial, solo lectura) ----------
// Classroom no se puede incrustar en un iframe (responde
// X-Frame-Options: SAMEORIGIN), por eso se lee con la API oficial de
// Google. El token de acceso vive solo en memoria: nunca se guarda en
// localStorage ni en el código.
let classroomToken = null;
let classroomTokenClient = null;
let classroomCourses = [];
let classroomOpenCourse = "";

function loadGsiScript() {
  return new Promise((resolve, reject) => {
    if (window.google && google.accounts && google.accounts.oauth2) return resolve();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("No se pudo cargar Google. Revisa tu conexión e intenta de nuevo."));
    document.head.appendChild(s);
  });
}

async function classroomFetch(path) {
  const r = await fetch("https://classroom.googleapis.com/v1" + path, {
    headers: { Authorization: "Bearer " + classroomToken }
  });
  if (!r.ok) {
    if (r.status === 401 || r.status === 403) throw new Error("La sesión de Google caducó o no tiene permiso. Desconecta y vuelve a conectar.");
    throw new Error("Google Classroom no respondió (" + r.status + "). Intenta de nuevo.");
  }
  return r.json();
}

function fmtDueDate(dueDate, dueTime) {
  if (!dueDate) return "";
  let s = dueDate.day + "/" + dueDate.month + "/" + dueDate.year;
  if (dueTime && dueTime.hours != null) s += " " + String(dueTime.hours).padStart(2, "0") + ":" + String(dueTime.minutes || 0).padStart(2, "0");
  return s;
}

async function connectClassroom() {
  const errEl = $("cr-err");
  if (CLASSROOM_CLIENT_ID === "PONER_CLIENT_ID_AQUI") {
    if (errEl) showErr(errEl, "La conexión con Classroom aún no está configurada (falta el ID de cliente de Google).");
    return;
  }
  try {
    await loadGsiScript();
    if (!classroomTokenClient) {
      classroomTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLASSROOM_CLIENT_ID,
        scope: CLASSROOM_SCOPES.join(" "),
        callback: (resp) => {
          if (resp && resp.access_token) {
            classroomToken = resp.access_token;
            renderClassroom();
          } else if (errEl) {
            showErr(errEl, "No se pudo conectar con Google. Intenta de nuevo.");
          }
        }
      });
    }
    classroomTokenClient.requestAccessToken({ prompt: "consent" });
  } catch (e) {
    if (errEl) showErr(errEl, "No se pudo conectar: " + (e.message || e));
  }
}

function disconnectClassroom() {
  if (classroomToken && window.google && google.accounts && google.accounts.oauth2) {
    try { google.accounts.oauth2.revoke(classroomToken, () => {}); } catch (e) {}
  }
  classroomToken = null;
  classroomCourses = [];
  classroomOpenCourse = "";
  renderClassroom();
}

// ---------- Respaldo en Google Drive ----------
let driveCodeClient = null;
let driveConn = null; // {email, connectedAt} del maestro seleccionado (o null)

function loadFunctionsScript() {
  return new Promise((resolve, reject) => {
    if (window.firebase && firebase.functions) return resolve();
    const s = document.createElement("script");
    s.src = "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js";
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("No se pudo cargar la conexión con el servidor. Revisa tu conexión e intenta de nuevo."));
    document.head.appendChild(s);
  });
}

async function fetchDriveConnection(teacherUid) {
  if (!teacherUid) return null;
  try {
    const d = await db.collection("driveConnections").doc(teacherUid).get();
    return d.exists ? d.data() : null;
  } catch (e) { return null; }
}

async function connectDrive() {
  const errEl = $("drive-err");
  if (DRIVE_CLIENT_ID === "PONER_CLIENT_ID_DRIVE_AQUI") {
    if (errEl) showErr(errEl, "La conexión con Drive aún no está configurada (falta el ID de cliente de Google).");
    return;
  }
  try {
    await loadGsiScript();
    await loadFunctionsScript();
    if (!driveCodeClient) {
      driveCodeClient = google.accounts.oauth2.initCodeClient({
        client_id: DRIVE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        ux_mode: "popup",
        redirect_uri: "postmessage",
        prompt: "consent",
        callback: async (resp) => {
          if (resp && resp.code) {
            try {
              const fn = firebase.functions().httpsCallable("exchangeDriveCode");
              const r = await fn({ code: resp.code });
              driveConn = { email: r.data.email, connectedAt: new Date() };
              renderStudents();
            } catch (e) {
              if (errEl) showErr(errEl, "No se pudo conectar tu Drive: " + (e.message || e));
            }
          } else if (errEl) {
            showErr(errEl, "No se completó la conexión con Google. Intenta de nuevo.");
          }
        }
      });
    }
    driveCodeClient.requestCode();
  } catch (e) {
    if (errEl) showErr(errEl, "No se pudo conectar: " + (e.message || e));
  }
}

async function disconnectDrive() {
  const errEl = $("drive-err");
  try {
    await loadFunctionsScript();
    const fn = firebase.functions().httpsCallable("disconnectDrive");
    await fn({});
    driveConn = null;
    renderStudents();
  } catch (e) {
    if (errEl) showErr(errEl, "No se pudo desconectar: " + (e.message || e));
  }
}

async function showCourseWork(courseId) {
  const box = $("cr-work-" + courseId);
  if (!box) return;
  box.innerHTML = `<p class="muted">Cargando tareas…</p>`;
  try {
    const data = await classroomFetch("/courses/" + encodeURIComponent(courseId) + "/courseWork?pageSize=50");
    const works = data.courseWork || [];
    if (!works.length) { box.innerHTML = `<p class="muted">Esta clase no tiene tareas todavía.</p>`; return; }
    // Lista de alumnos del curso (nombre por userId) para mostrar quién entregó.
    let roster = null;
    try {
      const st = await classroomFetch("/courses/" + encodeURIComponent(courseId) + "/students?pageSize=100");
      roster = {};
      (st.students || []).forEach(s => {
        const nm = (s.profile && s.profile.name && s.profile.name.fullName) || s.userId;
        roster[s.userId] = nm;
      });
    } catch (e) { roster = null; }
    const nameOf = (uid) => (roster && roster[uid]) || uid;
    box.innerHTML = works.map(w => `<div class="docline"><span><b>${esc(w.title || "Tarea")}</b>${w.dueDate ? ` <span class="muted">· Entrega: ${esc(fmtDueDate(w.dueDate, w.dueTime))}</span>` : ""}</span>
      <span class="muted" id="cr-count-${esc(w.id)}">Contando entregas…</span></div>
      <div><button class="small ghost" id="cr-who-${esc(w.id)}">Ver quiénes</button>
      <div id="cr-names-${esc(w.id)}" class="muted hidden">Cargando nombres…</div></div>`).join("");
    works.forEach((w) => {
      const btn = $("cr-who-" + w.id);
      const namesBox = $("cr-names-" + w.id);
      if (btn && namesBox) btn.addEventListener("click", () => {
        const show = namesBox.classList.contains("hidden");
        namesBox.classList.toggle("hidden", !show);
        btn.textContent = show ? "Ocultar" : "Ver quiénes";
      });
    });
    works.forEach(async (w) => {
      const el = $("cr-count-" + w.id);
      const namesBox = $("cr-names-" + w.id);
      try {
        const subs = await classroomFetch("/courses/" + encodeURIComponent(courseId) + "/courseWork/" + encodeURIComponent(w.id) + "/studentSubmissions?pageSize=100");
        const list = subs.studentSubmissions || [];
        // Entregada = el alumno la mandó (TURNED_IN, RETURNED o REJECTED); pendiente = NEW o CREATED.
        const isTurned = (x) => x.state === "TURNED_IN" || x.state === "RETURNED" || x.state === "REJECTED";
        const turned = list.filter(isTurned).length;
        if (el) el.textContent = "Entregadas " + turned + " de " + list.length;
        if (namesBox) {
          if (!roster) { namesBox.textContent = "No se pudieron cargar los nombres."; }
          else {
            const done = list.filter(isTurned).map(x => nameOf(x.userId) + (x.state === "REJECTED" ? " (devuelta)" : "")).sort((a, b) => a.localeCompare(b, "es"));
            const pend = list.filter(x => !isTurned(x)).map(x => nameOf(x.userId)).sort((a, b) => a.localeCompare(b, "es"));
            namesBox.innerHTML = `<b>Entregaron (${done.length}):</b> ${done.length ? esc(done.join(", ")) : "nadie todavía."}<br><b>Faltan (${pend.length}):</b> ${pend.length ? esc(pend.join(", ")) : "nadie."}`;
          }
        }
      } catch (e) {
        if (el) el.textContent = "No se pudo contar las entregas.";
        if (namesBox) namesBox.textContent = "No se pudieron cargar los nombres.";
      }
    });
  } catch (e) {
    box.innerHTML = `<p class="err">${esc(e.message || "No se pudieron cargar las tareas.")}</p>`;
  }
}

      <button class="gold" id="rec-add">Agregar grabación</button>
    </div>
    <div id="rec-msg" class="okmsg"></div><div id="rec-err" class="err"></div>
  </div>`;
  const saveRecs = async (arr) => {
    await db.collection("courses").doc(courseId).update({ recordings: arr });
    courses[courseId].recordings = arr;
    const btn = document.querySelector(`[data-rec-course="${courseId}"]`);
    if (btn) btn.textContent = "Grabaciones (" + arr.length + ")";
  };
  $("rec-add").addEventListener("click", async () => {
    const title = ($("rec-title").value || "").trim();
    const url = ($("rec-url").value || "").trim();
    const date = $("rec-date").value || "";
    if (!title || !url) { $("rec-err").textContent = "Escribe el título y el enlace de la grabación."; return; }
    if (!/^https?:\/\//i.test(url)) { $("rec-err").textContent = "El enlace debe empezar con http:// o https://."; return; }
    await saveRecs([...recs, { title, url, date }]);
    renderRecEditor(courseId);
    showOk($("rec-msg"), "Grabación agregada.");
  });
  box.querySelectorAll("[data-rec-del]").forEach(a => a.addEventListener("click", async (e) => {
    e.preventDefault();
    await saveRecs(recs.filter((_, i) => i !== parseInt(a.getAttribute("data-rec-del"), 10)));
    renderRecEditor(courseId);
    showOk($("rec-msg"), "Grabación quitada.");
  }));
}

      <td>${t.active === false ? '<span class="badge off">Desactivado</span>' : "Activo"}</td>
      <td>${t.role !== "admin" ? `<button class="small ghost" data-toggle-user="${t.uid}" data-active="${t.active === false ? "1" : "0"}">${t.active === false ? "Activar" : "Desactivar"}</button>` : ""} <button class="small" data-save-classroom="${t.uid}">Guardar Classroom</button></td></tr>`).join("")}
    </table>
  </div>`;
  $("btn-create-teacher").addEventListener("click", async () => {
    const name = $("nt-name").value.trim();
    const email = $("nt-email").value.trim();
    const pass = $("nt-pass").value;
    const selCourses = [...document.querySelectorAll(".new-teacher-course:checked")].map(x => x.value);
    showErr($("nt-err"), ""); showOk($("nt-msg"), "");
    if (!name || !email || pass.length < 6) { showErr($("nt-err"), "Faltan datos: nombre, correo y una contraseña de mínimo 6 caracteres."); return; }
    if (!selCourses.length) { showErr($("nt-err"), "Elige al menos un curso para este maestro."); return; }
    $("btn-create-teacher").disabled = true;
    try {
      const secondary = getSecondaryApp();
      const cred = await secondary.auth().createUserWithEmailAndPassword(email, pass);
      const uid = cred.user.uid;
      await secondary.auth().signOut();
      await db.collection("teachers").doc(uid).set({ name, email, role: "teacher", courses: selCourses, active: true });
      showOk($("nt-msg"), "Cuenta creada para " + name + " (" + email + ").");
      $("nt-name").value = ""; $("nt-email").value = ""; $("nt-pass").value = "";
      document.querySelectorAll(".new-teacher-course:checked").forEach(x => x.checked = false);
      renderTeachers();
    } catch (e) {
      showErr($("nt-err"), "No se pudo crear: " + (e.code === "auth/email-already-in-use" ? "ese correo ya tiene cuenta." : (e.message || e.code)));
    } finally { $("btn-create-teacher").disabled = false; }
  });
  s.querySelectorAll("[data-toggle-user]").forEach(b => b.addEventListener("click", async () => {
    const uid = b.getAttribute("data-toggle-user");
    const activate = b.getAttribute("data-active") === "1";
    await db.collection("teachers").doc(uid).update({ active: activate });
    renderTeachers();
  }));
  // Guardar los enlaces de Classroom de un maestro (uno por curso que imparte)
  // y propagarlos a las fichas de sus alumnos de cada curso.
  s.querySelectorAll("[data-save-classroom]").forEach(b => b.addEventListener("click", async () => {
    const uid = b.getAttribute("data-save-classroom");
    const inputs = [...s.querySelectorAll(`[data-teacher="${uid}"][data-field="classroomLink"]`)];
    const links = {};
    inputs.forEach(inp => { const v = inp.value.trim(); if (v) links[inp.getAttribute("data-course")] = v; });
    showErr($("nt-err"), ""); showOk($("nt-msg"), "");
    b.disabled = true;
    try {
      const tDoc = await db.collection("teachers").doc(uid).get();
      const assigned = tDoc.exists ? (tDoc.data().courses || []) : [];
      if (Object.keys(links).length) {
        await db.collection("teachers").doc(uid).update({ classroomLinks: links });
      } else {
        await db.collection("teachers").doc(uid).update({ classroomLinks: firebase.firestore.FieldValue.delete() });
      }
      const batch = db.batch();
      let n = 0;
      for (const cid of assigned) {
        const snap = await db.collection("students").where("teacherId", "==", uid).where("courseId", "==", cid).get();
        snap.forEach(d => {
          if (links[cid]) batch.update(d.ref, { teacherClassroomUrl: links[cid] });
          else batch.update(d.ref, { teacherClassroomUrl: firebase.firestore.FieldValue.delete() });
          n++;
        });
      }
      if (n) await batch.commit();
      showOk($("nt-msg"), "Enlaces de Classroom guardados." + (n ? " Actualizados " + n + " alumno(s)." : ""));
      renderTeachers();
    } catch (e) {
      showErr($("nt-err"), "No se pudo guardar: " + (e.message || e));
    } finally { b.disabled = false; }
  }));
}
</script>

// Cuenta de acceso de alumno: se crea con una app secundaria de Firebase
// para no cerrar la sesión del admin. Se reutiliza si ya existe.
let secondaryApp = null;
function getSecondaryApp() {
  if (!secondaryApp) {
    secondaryApp = firebase.apps.find(a => a.name === "secondary") || firebase.initializeApp(firebaseConfig, "secondary");
  }
  return secondaryApp;
}
async function listTeachers() {
  const snap = await db.collection("teachers").where("active", "!=", false).get();
  const out = []; snap.forEach(d => out.push({ uid: d.id, ...d.data() }));
  return out;
}
async function fetchStudents(courseId, teacherId) {
  let q = db.collection("students").where("courseId", "==", courseId);
  if (teacherId) q = q.where("teacherId", "==", teacherId);
  const snap = await q.get();
  const out = []; snap.forEach(d => out.push({ id: d.id, ...d.data() }));
  out.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  return out;
}
// ---------- Avisos del maestro ----------
// createdAt puede ser Timestamp de servidor, número o null: normalizar a ms.
function tsMillis(v) {
  if (!v) return 0;
  if (typeof v.toMillis === "function") return v.toMillis();
  if (typeof v === "number") return v;
  const d = new Date(v);
  return isNaN(d) ? 0 : d.getTime();
}
function fmtAvDate(v) {
  const ms = tsMillis(v);
  if (!ms) return "";
  return new Date(ms).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
}
async function fetchAnnouncements(courseId) {
  // Sin orderBy en la consulta (evita necesitar un índice compuesto en
  // Firestore): se ordena en el cliente por fecha descendente.
  const snap = await db.collection("announcements").where("courseId", "==", courseId).limit(20).get();
  const out = []; snap.forEach(d => out.push({ id: d.id, ...d.data() }));
  out.sort((a, b) => tsMillis(b.createdAt) - tsMillis(a.createdAt));
  return out;
}
// ---------- Diplomados ----------
async function fetchDiplomas() {
  const snap = await db.collection("diplomas").get();
  const out = []; snap.forEach(d => out.push({ id: d.id, ...d.data() }));
  out.sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "es"));
  return out;
}
async function renderStudents() {
  const s = $("section");
  const isAdmin = me.role === "admin";
  const myCourseIds = isAdmin ? Object.keys(courses) : (me.courses || []);
  if (!selCourse || !myCourseIds.includes(selCourse)) selCourse = myCourseIds[0] || "";
  let teachers = [];
  if (isAdmin) {
    teachers = (await listTeachers()).filter(t => (t.courses || []).includes(selCourse));
    if (!selTeacher || !teachers.some(t => t.uid === selTeacher)) selTeacher = teachers[0] ? teachers[0].uid : "";
  } else {
    selTeacher = me.uid;
  }
  const course = courses[selCourse] || {};
  const teacherObj = isAdmin ? teachers.find(t => t.uid === selTeacher) : me;
  driveConn = await fetchDriveConnection(selTeacher);
  // Enlace de Classroom del curso seleccionado: primero el propio del maestro, si no el del curso.
  const classroomLink = ((teacherObj && teacherObj.classroomLinks) || {})[selCourse] || course.classroomUrl || "";
  const students = selCourse ? await fetchStudents(selCourse, selTeacher) : [];
  const announcements = selCourse ? await fetchAnnouncements(selCourse) : [];
  diplomasCatalog = await fetchDiplomas();
  const editingSt = editingStudentId ? students.find(x => x.id === editingStudentId) : null;
  const courseOptions = myCourseIds.map(id => `<option value="${id}" ${id === selCourse ? "selected" : ""}>${esc(courses[id] ? courses[id].name : id)}</option>`).join("");
  const teacherOptions = isAdmin ? teachers.map(t => `<option value="${t.uid}" ${t.uid === selTeacher ? "selected" : ""}>${esc(t.name)}</option>`).join("") : "";
  s.innerHTML = `
  <div class="card"><h2>${isAdmin ? "Alumnos" : "Mis alumnos"}</h2>
    <p class="hint">La generación se calcula con la fecha de inicio del alumno y la duración del curso. Puedes corregirla a mano si hace falta.</p>
    <div class="row">
      <div><label>Curso</label><select id="sel-course">${courseOptions}</select></div>
      ${isAdmin ? `<div><label>Maestro/a</label><select id="sel-teacher">${teacherOptions}</select></div>` : ""}

    <div class="table-scroll"><table class="students${showAllCols ? " show-all" : ""}"><tr><th>Apellido y Nombre</th><th>CURP</th><th>Teléfono</th><th>Inicio</th><th>Generación</th><th>Docs</th>${isAdmin ? "<th>Acceso</th>" : ""}<th></th></tr>
    ${students.map(st => `<tr>
      <td>${esc(st.name)}</td><td>${esc(st.curp || "")}</td><td>${esc(st.phone || "")}</td>
      <td>${esc(st.startDate || "—")}</td><td>${st.generation ? esc(st.generation) : "—"}</td>
      <td><button class="small ghost" data-docs="${st.id}">Ver / subir</button></td>
      ${isAdmin ? `<td>${st.authUid ? `<span class="badge teacher">Con cuenta</span> <button class="small ghost" data-unlink="${st.id}">Quitar acceso</button>` : `<button class="small" data-account="${st.id}">Crear cuenta</button>`}</td>` : ""}
      <td><button class="small" data-edit="${st.id}">Editar</button></td></tr>
      <tr id="docs-row-${st.id}" class="hidden"><td colspan="${isAdmin ? 8 : 7}"><div id="docs-box-${st.id}"></div></td></tr>
      ${isAdmin ? `<tr id="acct-row-${st.id}" class="hidden"><td colspan="8"><div class="row"><div><label>Correo para la cuenta del alumno</label><input id="acct-email-${st.id}" type="email" placeholder="correo@ejemplo.com"></div><div><label>Contraseña inicial</label><input id="acct-pass-${st.id}" type="text" placeholder="Mínimo 6 caracteres"></div></div><div style="margin-top:10px"><button class="small gold" data-create-account="${st.id}">Crear cuenta de acceso</button></div><div id="acct-msg-${st.id}" class="okmsg"></div><div id="acct-err-${st.id}" class="err"></div><p class="muted">El alumno entrará al Portal Alumnos con este correo y contraseña. Si le quitas el acceso, su cuenta queda sin vincular (la cuenta de acceso no se borra desde aquí).</p></td></tr>` : ""}`).join("") || `<tr><td colspan="${isAdmin ? 8 : 7}" class="muted">Aún no hay alumnos en este curso con este maestro.</td></tr>`}
    </table></div>
  </div>
  <div class="card"><h2>Respaldo en Drive</h2>
    <p class="hint">Cada documento (PDF) que subas tú o tus alumnos se guarda en el portal y, si conectas tu Google Drive, también se copia automáticamente a una carpeta "Gecatech – Respaldo" en tu Drive. Conectar es opcional: sin conexión, tus archivos siguen guardados y visibles aquí.</p>
    ${DRIVE_CLIENT_ID === "PONER_CLIENT_ID_DRIVE_AQUI" ? `<p class="err">La conexión con Drive aún no está configurada (falta el ID de cliente de Google).</p>` : (driveConn ? `<p>Conectado como <b>${esc(driveConn.email || "tu cuenta de Google")}</b></p>` : `<p class="muted">No conectado — tus archivos se guardan en el portal; la copia en Drive está desactivada.</p>`)}
    ${isAdmin ? `<p class="muted">Solo el maestro puede conectar su Drive. Estás viendo el estado de ${esc(teacherObj ? teacherObj.name : "")}.</p>` : (DRIVE_CLIENT_ID === "PONER_CLIENT_ID_DRIVE_AQUI" ? `` : (driveConn ? `<button id="btn-drive-disconnect" class="ghost">Desconectar mi Google Drive</button>` : `<button id="btn-drive-connect" class="gold">Conectar mi Google Drive</button>`))}
    <div id="drive-err" class="err"></div>
  </div>
  ${selCourse ? `<div class="card"><h2>Avisos para este curso</h2>

    ${announcements.map(a => `<div class="docline" style="align-items:flex-start"><div style="flex:1"><strong>${esc(a.title || "Aviso")}</strong> <span class="muted">${fmtAvDate(a.createdAt)}${a.teacherName ? " · " + esc(a.teacherName) : ""}</span><br>${esc(a.text || "")}</div>${(isAdmin || a.teacherId === me.uid) ? `<button class="small ghost" data-del-av="${a.id}" style="color:var(--err)">Eliminar</button>` : ""}</div>`).join("") || `<p class="muted">Aún no hay avisos para este curso.</p>`}

      <div><label>Título</label><input id="av-title" placeholder="Ej. Cambio de horario"></div>
    </div>
    <div class="row">
      <div><label>Mensaje</label><textarea id="av-text" rows="3" placeholder="Escribe el aviso para tus alumnos…"></textarea></div>
    </div>
    <div style="margin-top:10px"><button id="btn-publish-av" class="gold">Publicar aviso</button></div>
    <div id="av-msg" class="okmsg"></div><div id="av-err" class="err"></div>
  </div>` : ""}
  <div class="card"><h2>${editingStudentId ? "Editar alumno" : "Dar de alta a un alumno"}</h2>
    <div class="row">
      <div><label>Apellido y Nombre</label><input id="st-name" placeholder="Ej. Juan Pérez López"></div>
      <div><label>CURP</label><input id="st-curp" placeholder="CURP del alumno"></div>
      <div><label>Teléfono</label><input id="st-phone" placeholder="Teléfono / WhatsApp"></div>
    </div>
    <div class="row">
      <div><label>Fecha de inicio de clases</label><input id="st-start" type="date"></div>
      <div><label>Generación (año de graduación)</label><input id="st-gen" type="number" placeholder="Se calcula sola"></div>
    </div>
    <div style="margin-top:12px"><h3>Diplomados</h3>
    ${diplomasCatalog.length ? diplomasCatalog.map(dp => {
      const cur = (editingSt && editingSt.diplomas && editingSt.diplomas[dp.id]) || "pendiente";
      return `<div class="row"><div><label>${esc(dp.name)}</label><select id="diploma-sel-${dp.id}"><option value="pendiente"${cur === "pendiente" ? " selected" : ""}>Pendiente</option><option value="en_curso"${cur === "en_curso" ? " selected" : ""}>En curso</option><option value="completado"${cur === "completado" ? " selected" : ""}>Completado</option></select></div></div>`;
    }).join("") : `<p class="muted">Aún no hay diplomados registrados. Agrégalos en la pestaña Cursos.</p>`}
    </div>
    <div style="margin-top:14px"><button id="btn-save-student" class="gold">${editingStudentId ? "Guardar cambios" : "Dar de alta"}</button>
    ${editingStudentId ? `<button id="btn-cancel-edit" class="ghost">Cancelar</button>` : ""}</div>
    <div id="st-msg" class="okmsg"></div><div id="st-err" class="err"></div>
  </div>`;

  $("sel-course").addEventListener("change", (e) => { selCourse = e.target.value; selTeacher = ""; editingStudentId = null; renderStudents(); });
  const stSel = $("sel-teacher");
  if (stSel) stSel.addEventListener("change", (e) => { selTeacher = e.target.value; editingStudentId = null; renderStudents(); });
  const btnClassroom = $("btn-classroom");
  if (btnClassroom) btnClassroom.addEventListener("click", () => window.open(classroomLink, "_blank"));
  const btnDriveConnect = $("btn-drive-connect");
  if (btnDriveConnect) btnDriveConnect.addEventListener("click", connectDrive);
  const btnDriveDisconnect = $("btn-drive-disconnect");
  if (btnDriveDisconnect) btnDriveDisconnect.addEventListener("click", disconnectDrive);
  const btnToggleCols = $("btn-toggle-cols");
  if (btnToggleCols) btnToggleCols.addEventListener("click", () => { showAllCols = !showAllCols; renderStudents(); });
  $("btn-export").addEventListener("click", async () => {

      showErr($("exp-err"), "");
      await exportAttendance(course, teacherObj, students, false);
      showOk($("exp-msg"), "Lista exportada.");
    } catch (e) { showErr($("exp-err"), "No se pudo exportar: " + (e.message || e)); }
  });
  $("btn-blank").addEventListener("click", async () => {
    try {
      showErr($("exp-err"), "");
      await exportAttendance(course, teacherObj, [], true);
      showOk($("exp-msg"), "Plantilla en blanco descargada.");
    } catch (e) { showErr($("exp-err"), "No se pudo descargar: " + (e.message || e)); }
  });
  // Avisos para este curso: publicar y eliminar.
  const btnPublishAv = $("btn-publish-av");
  if (btnPublishAv) btnPublishAv.addEventListener("click", async () => {
    const title = $("av-title").value.trim();
    const text = $("av-text").value.trim();
    showErr($("av-err"), ""); showOk($("av-msg"), "");
    if (!title || !text) { showErr($("av-err"), "Escribe el título y el mensaje del aviso."); return; }
    if (!teacherObj) { showErr($("av-err"), "Elige un maestro primero."); return; }
    btnPublishAv.disabled = true;
    try {
      await db.collection("announcements").add({ courseId: selCourse, teacherId: teacherObj.uid, teacherName: teacherObj.name, title, text, createdAt: firebase.firestore.FieldValue.serverTimestamp(), active: true });
      await renderStudents();
      showOk($("av-msg"), "Aviso publicado.");
    } catch (e) { showErr($("av-err"), "No se pudo publicar: " + (e.message || e)); }
    finally { btnPublishAv.disabled = false; }
  });
  s.querySelectorAll("[data-del-av]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("¿Eliminar este aviso? Los alumnos dejarán de verlo.")) return;
    try {
      await db.collection("announcements").doc(b.getAttribute("data-del-av")).delete();
      renderStudents();
    } catch (e) { showErr($("exp-err"), "No se pudo eliminar: " + (e.message || e)); }
  }));
  s.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", async () => {
    const st = students.find(x => x.id === b.getAttribute("data-edit"));
    if (!st) return;
    editingStudentId = st.id;
    await renderStudents();
    $("st-name").value = st.name || "";
    $("st-curp").value = st.curp || "";
    $("st-phone").value = st.phone || "";
    $("st-start").value = st.startDate || "";
    $("st-gen").value = st.generation || "";
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }));
  s.querySelectorAll("[data-docs]").forEach(b => b.addEventListener("click", async () => {
    const id = b.getAttribute("data-docs");
    const row = $("docs-row-" + id);
    const box = $("docs-box-" + id);
    if (row.classList.contains("hidden")) {
      row.classList.remove("hidden");
      await renderDocsBox(box, id, selTeacher);
    } else row.classList.add("hidden");
  }));
  s.querySelectorAll("[data-account]").forEach(b => b.addEventListener("click", () => {
    const row = $("acct-row-" + b.getAttribute("data-account"));
    if (row) row.classList.toggle("hidden");
  }));
  s.querySelectorAll("[data-create-account]").forEach(b => b.addEventListener("click", async () => {
    const id = b.getAttribute("data-create-account");
    const email = $("acct-email-" + id).value.trim();
    const pass = $("acct-pass-" + id).value;
    showErr($("acct-err-" + id), ""); showOk($("acct-msg-" + id), "");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr($("acct-err-" + id), "Escribe un correo válido."); return; }
    if (pass.length < 6) { showErr($("acct-err-" + id), "La contraseña debe tener mínimo 6 caracteres."); return; }
    b.disabled = true;
    try {
      const secondary = getSecondaryApp();
      const cred = await secondary.auth().createUserWithEmailAndPassword(email, pass);
      await secondary.auth().signOut();
      const update = { authUid: cred.user.uid };
      let teacherNote = "";
      try {
        const stDoc = await db.collection("students").doc(id).get();
        const teacherId = stDoc.exists ? (stDoc.data().teacherId || "") : "";
        if (teacherId) {
          const tDoc = await db.collection("teachers").doc(teacherId).get();
          const tName = tDoc.exists ? (tDoc.data().name || "").trim() : "";
          if (tName) {
            update.teacherName = tName;
            const contact = TEACHER_CONTACTS[tName];
            if (contact) update.teacherWhatsApp = contact.wa;
          }
          // Enlace de Classroom de ese maestro para el curso de este alumno.
          const courseId = stDoc.exists ? (stDoc.data().courseId || "") : "";
          const links = tDoc.exists ? (tDoc.data().classroomLinks || {}) : {};
          if (courseId && links[courseId]) update.teacherClassroomUrl = links[courseId];
        }
      } catch (lookupErr) {
        teacherNote = " (No se pudo guardar el maestro en su ficha, pero la cuenta sí quedó creada.)";
      }
      await db.collection("students").doc(id).update(update);
      showOk($("acct-msg-" + id), "Cuenta de acceso creada para " + email + "." + teacherNote);
      renderStudents();
    } catch (e) {
      showErr($("acct-err-" + id), "No se pudo crear: " + (e.code === "auth/email-already-in-use" ? "ese correo ya tiene cuenta." : (e.message || e.code)));
    } finally { b.disabled = false; }
  }));
  s.querySelectorAll("[data-unlink]").forEach(b => b.addEventListener("click", async () => {
    const id = b.getAttribute("data-unlink");
    if (!confirm("¿Quitar el acceso de este alumno al Portal Alumnos? Su cuenta de acceso quedará sin vincular.")) return;
    try {
      await db.collection("students").doc(id).update({ authUid: firebase.firestore.FieldValue.delete() });
      renderStudents();
    } catch (e) { showErr($("exp-err"), "No se pudo quitar el acceso: " + (e.message || e)); }
  }));
  const cancel = $("btn-cancel-edit");
  if (cancel) cancel.addEventListener("click", () => { editingStudentId = null; renderStudents(); });
  $("st-start").addEventListener("change", () => {
    const g = calcGeneration($("st-start").value, (courses[selCourse] || {}).durationMonths || 12);
    if (g) $("st-gen").value = g;
  });
  $("btn-save-student").addEventListener("click", async () => {
    const name = $("st-name").value.trim();
    const curp = $("st-curp").value.trim();
    const phone = $("st-phone").value.trim();
    const startDate = $("st-start").value;
    let generation = parseInt($("st-gen").value, 10);
    if (!generation && startDate) generation = calcGeneration(startDate, (courses[selCourse] || {}).durationMonths || 12);
    showErr($("st-err"), ""); showOk($("st-msg"), "");
    if (!name) { showErr($("st-err"), "Escribe el nombre del alumno."); return; }
    if (!selCourse || !selTeacher) { showErr($("st-err"), "Elige curso y maestro primero."); return; }
    $("btn-save-student").disabled = true;
    try {
      const diplomasMap = {};
      diplomasCatalog.forEach(dp => {
        const sel = $("diploma-sel-" + dp.id);
        if (sel && sel.value) diplomasMap[dp.id] = sel.value;
      });
      const data = { name, curp, phone, courseId: selCourse, teacherId: selTeacher, startDate: startDate || "", generation: generation || "", active: true, diplomas: diplomasMap };
      if (editingStudentId) {
        await db.collection("students").doc(editingStudentId).update(data);
        showOk($("st-msg"), "Alumno actualizado.");
      } else {
        data.createdAt = Date.now();
        await db.collection("students").add(data);
        showOk($("st-msg"), "Alumno dado de alta.");
      }
      editingStudentId = null;
      renderStudents();
    } catch (e) { showErr($("st-err"), "No se pudo guardar: " + (e.message || e)); }
    finally { $("btn-save-student").disabled = false; }
  });
}

// ---------- Documentos por alumno ----------
async function renderDocsBox(box, studentId, teacherId) {
  box.innerHTML = `<p class="muted">Cargando documentos…</p>`;
  try {
    const snap = await db.collection("students").doc(studentId).collection("docs").orderBy("uploadedAt").get();
    const docs = []; snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
    box.innerHTML = `
      ${docs.map(d => `<div class="docline"><span>${esc(d.name)}</span><span class="muted">${d.size ? Math.round(d.size / 1024) + " KB" : ""}</span>
        <a href="#" data-dl="${d.id}" data-path="${esc(d.path)}">Descargar</a>
        <a href="#" data-del-doc="${d.id}" data-path="${esc(d.path)}" style="color:var(--err)">Eliminar</a></div>`).join("") || `<p class="muted">Sin documentos todavía. Sube el INE, CURP, acta o comprobantes en PDF.</p>`}
      <div style="margin-top:10px"><input type="file" id="up-${studentId}" accept="application/pdf" style="width:auto">
      <button class="small gold" id="btn-up-${studentId}">Subir PDF</button></div>
      <div id="up-msg-${studentId}" class="okmsg"></div><div id="up-err-${studentId}" class="err"></div>`;
    box.querySelectorAll("[data-dl]").forEach(a => a.addEventListener("click", async (e) => {
      e.preventDefault();
      try { const url = await storage.ref(a.getAttribute("data-path")).getDownloadURL(); window.open(url, "_blank"); }
      catch (err) { showErr($("up-err-" + studentId), "No se pudo abrir el documento."); }
    }));
    box.querySelectorAll("[data-del-doc]").forEach(a => a.addEventListener("click", async (e) => {
      e.preventDefault();
      if (!confirm("¿Eliminar este documento?")) return;
      try {
        await storage.ref(a.getAttribute("data-path")).delete();
        await db.collection("students").doc(studentId).collection("docs").doc(a.getAttribute("data-del-doc")).delete();
        renderDocsBox(box, studentId, teacherId);
      } catch (err) { showErr($("up-err-" + studentId), "No se pudo eliminar."); }
    }));
    $("btn-up-" + studentId).addEventListener("click", async () => {
      const input = $("up-" + studentId);
      const file = input.files[0];
      showErr($("up-err-" + studentId), ""); showOk($("up-msg-" + studentId), "");
      if (!file) { showErr($("up-err-" + studentId), "Elige un archivo PDF primero."); return; }
      if (file.type !== "application/pdf") { showErr($("up-err-" + studentId), "Solo se aceptan archivos PDF."); return; }
      $("btn-up-" + studentId).disabled = true;
      try {
        const path = "alumnos/" + teacherId + "/" + studentId + "/" + Date.now() + "_" + file.name.replace(/[^A-Za-z0-9._-]/g, "_");
        await storage.ref(path).put(file);
        await db.collection("students").doc(studentId).collection("docs").add({ name: file.name, path, size: file.size, uploadedAt: Date.now(), uploadedBy: me.uid });
        showOk($("up-msg-" + studentId), "Documento subido.");
        renderDocsBox(box, studentId, teacherId);
      } catch (err) {
        showErr($("up-err-" + studentId), "La subida de documentos aún no está activada en Firebase (falta activar el almacenamiento). Los demás datos del portal sí funcionan.");
      } finally { $("btn-up-" + studentId).disabled = false; }
    });
  } catch (e) {
    box.innerHTML = `<p class="err">No se pudieron cargar los documentos.</p>`;
  }
}
</script>

<script>
// ---------- Exportar lista en Excel (igual a la plantilla, con logo) ----------
// Arma UNA hoja con el formato exacto de la plantilla: logo, encabezado
// B2–B5 (curso/horario/maestro), fila 9 de encabezados, grupos de mes de
// 4 columnas y alumnos desde la fila 10.
function buildAttendanceSheet(wb, imageId, sheetName, course, teacher, students, blank) {
  const ws = wb.addWorksheet(sheetName);
  // Anchos iguales a la plantilla original
  ws.getColumn(1).width = 36.57;
  ws.getColumn(2).width = 22.86;
  ws.getColumn(3).width = 18.29;
  ws.getColumn(4).width = 22.86;
  // Logo de Gecatech arriba (columnas A, filas 1-6, celdas vacías en la plantilla)
  ws.addImage(imageId, { tl: { col: 0, row: 0 }, ext: { width: 150, height: 115 } });
  // Encabezado, igual que la plantilla
  ws.getCell("B2").value = "Registro de asistencia:";
  ws.getCell("B2").font = { bold: true };
  ws.getCell("B3").value = "Curso:";
  ws.getCell("B3").font = { bold: true };
  ws.getCell("C3").value = blank ? "" : (course.name || "");
  ws.getCell("B4").value = "Horario:";
  ws.getCell("B4").font = { bold: true };
  ws.getCell("C4").value = blank ? "" : (course.schedule || "");
  ws.getCell("B5").value = "Maestro:";
  ws.getCell("B5").font = { bold: true };
  ws.getCell("C5").value = blank ? "" : (teacher ? teacher.name : "");
  ws.mergeCells("C5:D5");
  // Grupos de mes: 4 columnas por mes, desde el inicio del curso hasta el mes actual
  const months = blank ? monthRange("") : monthRange(course.startDate || "");
  const firstMonthCol = 5; // E
  months.forEach((mo, i) => {
    const c0 = firstMonthCol + i * 4;
    const c1 = c0 + 3;
    const cell = ws.getCell(9, c0);
    cell.value = MONTHS_ES[mo.m];
    cell.font = { bold: true };
    ws.mergeCells(9, c0, 9, c1);
    for (let c = c0; c <= c1; c++) ws.getColumn(c).width = 13;
  });
  // Encabezados de columna (fila 9)
  ["Apellido y Nombre", "CURP", "Teléfono", "Generación"].forEach((h, i) => {
    const cell = ws.getCell(9, i + 1);
    cell.value = h;
    cell.font = { bold: true };
  });
  // Alumnos desde la fila 10
  students.forEach((st, i) => {
    const r = 10 + i;
    ws.getCell(r, 1).value = st.name || "";
    ws.getCell(r, 2).value = st.curp || "";
    ws.getCell(r, 3).value = st.phone || "";
    ws.getCell(r, 4).value = st.generation ? Number(st.generation) : "";
  });
}

// ExcelJS solo se carga cuando se exporta (no en cada visita al portal).
let excelJSLoading = null;
function ensureExcelJS() {
  if (window.ExcelJS) return Promise.resolve();
  if (excelJSLoading) return excelJSLoading;
  excelJSLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
    s.onload = () => resolve();
    s.onerror = () => { excelJSLoading = null; reject(new Error("No se pudo cargar el generador de Excel. Revisa tu conexión e inténtalo de nuevo.")); };
    document.head.appendChild(s);
  });
  return excelJSLoading;
}

async function exportAttendance(course, teacher, students, blank) {
  await ensureExcelJS();
  const wb = new ExcelJS.Workbook();
  const imageId = wb.addImage({ base64: LOGO_BASE64, extension: "jpeg" });
  if (blank) {
    // Plantilla en blanco: una sola hoja, sin alumnos ni datos del curso
    buildAttendanceSheet(wb, imageId, "Lista de Asistencia", course, teacher, [], true);
  } else {
    // Una pestaña por generación (2027, 2028, ...); sin generación, al final
    const groups = {};
    (students || []).forEach((st) => {
      const g = (st.generation == null ? "" : String(st.generation).trim());
      (groups[g] = groups[g] || []).push(st);
    });
    const genKeys = Object.keys(groups).filter((g) => g !== "").sort((a, b) => (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0));
    if (groups[""]) genKeys.push("");
    if (genKeys.length === 0) {
      buildAttendanceSheet(wb, imageId, "Lista de Asistencia", course, teacher, [], false);
    } else {
      genKeys.forEach((g) => {
        const sheetName = g === "" ? "Sin generación" : ("Generación " + g);
        buildAttendanceSheet(wb, imageId, sheetName, course, teacher, groups[g], false);
      });
    }
  }
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const a = document.createElement("a");
  const now = new Date();
  const stamp = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const courseSlug = (course.name || "curso").replace(/[^A-Za-z0-9]+/g, "_");
  a.href = URL.createObjectURL(blob);
  a.download = blank ? "Plantilla_lista_asistencia_en_blanco.xlsx" : ("Lista_asistencia_" + courseSlug + "_" + stamp + ".xlsx");
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

</script>
