// ---------- Mis cursos ----------
async function loadEnrollments() {
  // Solo trae las fichas vinculadas a esta cuenta (authUid == mi uid).
  const snap = await db.collection("students").where("authUid", "==", myUid).get();
  const list = [];
  snap.forEach(d => { const data = d.data(); if (data.active !== false) list.push({ id: d.id, ...data }); });
  list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const courses = {};
  for (const cid of [...new Set(list.map(s => s.courseId))]) {
    if (!cid) continue;
    const doc = await db.collection("courses").doc(cid).get();
    if (doc.exists) courses[cid] = doc.data();
  }
  return { list, courses };
}
// Normaliza una fecha a "YYYY-MM-DD" para poder compararla. "" si no se puede.
function normDate(d) {
  if (!d) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d).trim());
  if (m) return m[1] + "-" + m[2] + "-" + m[3];
  const dt = new Date(d);
  if (isNaN(dt)) return "";
  const p = n => String(n).padStart(2, "0");
  return dt.getFullYear() + "-" + p(dt.getMonth() + 1) + "-" + p(dt.getDate());
}
function fmtRecDate(d) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || "");
  if (!m) return d || "";
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
}
// createdAt puede ser Timestamp de servidor, número o null: normalizar a ms.
function tsMillis(v) {
  if (!v) return 0;
  if (typeof v.toMillis === "function") return v.toMillis();
  if (typeof v === "number") return v;
  const d = new Date(v);
  return isNaN(d) ? 0 : d.getTime();
}
function fmtAvDate(v) {
  const ms = tsMillis(v);
  if (!ms) return "";
  return new Date(ms).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
}
// ¿Hoy es día de clase de este curso? Busca el día de la semana en el horario
// ("Martes 8-10 p. m.", "Lunes y Miércoles…"). "Varios horarios" no tiene un
// único día, así que no muestra la banda.
function isClassToday(schedule) {
  const days = ["domingo", "lunes", "martes", "miercoles", "jueves", "viernes", "sabado"];
  const norm = String(schedule || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const found = norm.match(/\b(domingo|lunes|martes|miercoles|jueves|viernes|sabado)\b/g) || [];
  return found.includes(days[new Date().getDay()]);
}

// ---------- Mi próxima clase ----------
// Saca los días y la hora de inicio del horario del alumno
// ("Martes 8-10 p. m.", "Lunes 9:30-11:30 p. m.", "Martes 20:00–22:00").
// null si el horario no tiene día ni hora claros ("Varios horarios").
const WEEKDAYS = { domingo: 0, lunes: 1, martes: 2, miercoles: 3, jueves: 4, viernes: 5, sabado: 6 };
function parseSchedule(schedule) {
  const norm = String(schedule || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const dayNames = norm.match(/\b(domingo|lunes|martes|miercoles|jueves|viernes|sabado)\b/g) || [];
  if (!dayNames.length) return null;
  const days = [...new Set(dayNames.map(d => WEEKDAYS[d]))];
  const t = norm.replace(/[–—]/g, "-").replace(/\./g, "").replace(/\bp\s*m\b/g, "pm").replace(/\ba\s*m\b/g, "am");
  const m = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*-\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/.exec(t);
  if (!m) return null;
  let h1 = +m[1];
  const min1 = m[2] ? +m[2] : 0;
  const ap = m[3] || m[6] || null;
  if (ap === "pm" && h1 < 12) h1 += 12;
  if (ap === "am" && h1 === 12) h1 = 0;
  if (h1 > 23) return null;
  return { days, hour: h1, minute: min1 };
}
// La siguiente fecha/hora en que toca clase según el horario, desde `from`.
function nextOccurrence(sched, from) {
  let best = null;
  for (const d of sched.days) {
    const t = new Date(from.getFullYear(), from.getMonth(), from.getDate(), sched.hour, sched.minute, 0);
    t.setDate(t.getDate() + ((d - from.getDay() + 7) % 7));
    if (t <= from) t.setDate(t.getDate() + 7);
    if (!best || t < best) best = t;
  }
  return best;
}
// La próxima clase entre todos los cursos del alumno (la más cercana).
function buildNextClass(list, courses) {
  const now = new Date();
  let best = null;
  for (const st of list) {
    const course = courses[st.courseId] || {};
    const sched = parseSchedule((st.classLabel || "").trim() || course.schedule);
    if (!sched) continue;
    const target = nextOccurrence(sched, now);
    if (!target) continue;
    if (!best || target < best.target) best = { st, course, sched, target };
  }
  return best;
}
let cdTimer = null;
let nextClassInfo = null;
function stopCountdown() { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } }
function tickCountdown() {
  const info = nextClassInfo;
  if (!info) return;
  const el = (id) => document.getElementById(id);
  if (!el("cd-d")) { stopCountdown(); return; }
  let diff = info.target - new Date();
  if (diff <= 0) { // la clase ya empezó: la cuenta regresiva pasa a la siguiente
    info.target = nextOccurrence(info.sched, new Date());
    diff = info.target - new Date();
  }
  el("cd-d").textContent = Math.floor(diff / 864e5);
  el("cd-h").textContent = Math.floor(diff / 36e5) % 24;
  el("cd-m").textContent = Math.floor(diff / 6e4) % 60;
  el("cd-s").textContent = Math.floor(diff / 1e3) % 60;
}

  // 1) El maestro guardado en la ficha del alumno al crear su cuenta: es el

  // opcional (hay maestros sin número guardado) y el botón de WhatsApp
  // solo se muestra cuando el maestro tiene número.
  if (st && ((st.teacherName || "").trim() || (st.teacherPhotoUrl || "").trim())) {
    const name = (st.teacherName || "").trim();
    const mapped = name && TEACHER_CONTACTS[name];
    return { label: (mapped && mapped.label) || name || "Tu maestro/a", phone: (mapped && mapped.phone) || "", wa: st.teacherWhatsApp ? String(st.teacherWhatsApp) : "", photoUrl: (st.teacherPhotoUrl || "").trim() };
  }
  // 2) El maestro del curso (sirve para cursos de un solo maestro).
  const name = course && course.teacher ? String(course.teacher).trim() : "";
  if (name && TEACHER_CONTACTS[name]) return { name, ...TEACHER_CONTACTS[name] };
  return null;
}
// Enlace de Meet de la clase del alumno (denormalizado en su ficha como
// classMeetUrl). "" si su clase aún no tiene enlace: el botón no se muestra.
function classMeetUrlOf(st) {
  return (st && st.classMeetUrl ? String(st.classMeetUrl) : "").trim();
}
async function enterApp() {
  stopCountdown();
  $("view-login").classList.add("hidden");
  $("view-app").classList.remove("hidden");
  const s = $("section");
  s.innerHTML = `<p class="muted">Cargando tus cursos…</p>`;
  let data;
  try {
    data = await loadEnrollments();
  } catch (e) {
    s.innerHTML = `<div class="card"><h2>No se pudieron cargar tus cursos</h2><p>Inténtalo de nuevo más tarde. Si el problema sigue, avísale a tu maestro o al administrador.</p></div>`;
    $("user-chip").innerHTML = esc(myEmail) + "<br>Alumno/a";
    return;
  }
  const { list, courses } = data;
  myEnrollments = list;
  if (list.length) myName = list[0].name || "";
  $("user-chip").innerHTML = esc(myName || myEmail) + "<br>Alumno/a";
  if (!list.length) {
    s.innerHTML = `<div class="card"><h2>Sin cursos vinculados</h2><p>Tu cuenta aún no está vinculada a ningún curso. Pide a tu maestro o al administrador que te vincule.</p></div>`;
    return;
  }
  // Si el admin restableció la contraseña, se abre "Mi cuenta" y no se
  // muestran los cursos hasta que el alumno la cambie por una suya.
  if (list.some(d => d.mustChangePassword === true)) { renderAccount(); return; }
  // Avisos del maestro por curso (solo los activos, los 5 más recientes).
  // Sin orderBy en la consulta (evita necesitar un índice compuesto):
  // se ordena en el cliente por fecha descendente.
  const announcementsByCourse = {};
  await Promise.all([...new Set(list.map(s => s.courseId))].filter(Boolean).map(async cid => {
    try {
      const snap = await db.collection("announcements").where("courseId", "==", cid).where("active", "==", true).get();
      const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
      arr.sort((a, b) => tsMillis(b.createdAt) - tsMillis(a.createdAt));
      announcementsByCourse[cid] = arr.slice(0, 5);
    } catch (e) { announcementsByCourse[cid] = []; }
  }));
  // Catálogo de diplomados (para mostrar los nombres en "Mis diplomados").
  let diplomasCatalog = {};
  try {
    const snap = await db.collection("diplomas").get();
    snap.forEach(d => { diplomasCatalog[d.id] = d.data().name || ""; });
  } catch (e) { diplomasCatalog = {}; }
  // Tarjeta destacada "Mi próxima clase": la siguiente clase de cualquiera
  // de sus cursos, con cuenta regresiva en vivo y su enlace de Meet.
  // Solo aparece si al menos un curso tiene un horario con día y hora.
  nextClassInfo = buildNextClass(list, courses);
  const heroSlot = nextClassInfo ? `<div id="next-class"></div>` : "";
  s.innerHTML = heroSlot + list.map(st => {
    const course = courses[st.courseId] || {};
    const contact = teacherContact(course, st);
    const teacherLabel = contact ? contact.label : "Tu maestro/a";
    // WhatsApp: el del maestro de la ficha si lo tiene; si no hay maestro
    // en la ficha, el de informes generales. Si el maestro de la ficha no
    // tiene número guardado, no se muestra el botón.
    const wa = contact ? (contact.wa ? contact : null) : GENERAL_CONTACT;
    const waText = "Hola, soy alumno/a de Gecatech del curso " + (course.name || "") + ".";
    // Enlace de Classroom: 1) el de su propio maestro; 2) el del curso como respaldo.
    const classroomUrl = (st.teacherClassroomUrl || "").trim() || (course.classroomUrl || "").trim();
    // Enlace de Meet de su clase (solo si la clase ya tiene uno).
    const meetUrl = classMeetUrlOf(st);
    // Grabaciones del curso (courses/{id}.recordings).
    // El alumno solo ve las grabaciones desde su fecha de ingreso en este
    // curso: las de clases anteriores a su ingreso no se le muestran.
    const joined = normDate(st.startDate);
    const recs = (Array.isArray(course.recordings) ? course.recordings : []).filter(r => {
      if (!joined) return true;            // sin fecha de ingreso: se ven todas
      const d = normDate(r && r.date);
      if (!d) return true;                 // grabación sin fecha: se muestra
      return d >= joined;                  // solo desde su ingreso (incluido)
    });
    // Avisos del maestro de este curso (los 5 más recientes).
    const avs = announcementsByCourse[st.courseId] || [];
    const avHtml = `<div style="margin-top:10px"><h3>Avisos del maestro</h3>` + (avs.length ? avs.map(a => {
      const ms = tsMillis(a.createdAt);
      const isNew = ms && (Date.now() - ms) < 7 * 24 * 60 * 60 * 1000;
      return `<p><strong>${esc(a.title || "Aviso")}</strong>${isNew ? ` <span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#c9a227;color:#fff">Nuevo</span>` : ""} <span class="muted">${fmtAvDate(a.createdAt)}</span><br>${esc(a.text || "")}</p>`;
    }).join("") : `<p class="muted">No hay avisos por ahora.</p>`) + `</div>`;
    // Mis diplomados: solo si el curso tiene visible la sección y el alumno
    // tiene diplomados registrados. Si no, no se muestra nada.
    const myDiplomas = st.diplomas || {};
    const dipEntries = Object.entries(myDiplomas).filter(([id]) => diplomasCatalog[id]);
    const dipHtml = (course.showDiplomas === true && dipEntries.length)
      ? `<div style="margin-top:10px"><h3>Mis diplomados</h3>` + dipEntries.map(([id, status]) => {
          const label = status === "completado" ? "Completado" : status === "en_curso" ? "En curso" : "Pendiente";
          return `<p>${esc(diplomasCatalog[id])} <span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#dcebf7;color:#0b2a4a">${label}</span></p>`;
        }).join("") + `</div>`
      : "";
    return `<div class="card">
      <h2>${esc(course.name || "Curso")}</h2>
      ${isClassToday((st.classLabel || "").trim() || course.schedule) ? `<p style="background:#fdeecb;color:#7a5c00;border-radius:8px;padding:8px 10px;font-weight:600">Hoy tienes clase de ${esc(course.name || "este curso")}</p>` : ""}
      <p class="hint">${esc((st.classLabel || "").trim() || course.schedule || "")}</p>
      <p>${teacherPhotoHtml(contact ? contact.photoUrl : "", teacherLabel)}<strong>Maestro/a:</strong> ${esc(teacherLabel)}</p>
      ${wa ? `<p><a class="btn gold" target="_blank" rel="noopener" href="https://wa.me/${wa.wa}?text=${encodeURIComponent(waText)}">WhatsApp con ${esc(contact ? contact.label : "informes generales")}</a> <span class="muted">${esc(wa.phone || "")}</span></p>` : ""}
      ${classroomUrl ? `<p><a class="btn" target="_blank" rel="noopener" href="${esc(classroomUrl)}">Entrar a mi Classroom</a></p>` : ""}
      ${meetUrl ? `<p><a class="btn gold" target="_blank" rel="noopener" href="${esc(meetUrl)}">Entrar a mi clase</a></p>` : ""}
      ${recs.length ? `<div style="margin-top:10px"><h3>Grabaciones</h3>${recs.map(r => `<p><a target="_blank" rel="noopener" href="${esc(r.url || "")}">${esc(r.title || "Grabación")}</a>${r.date ? ` <span class="muted">${fmtRecDate(r.date)}</span>` : ""}</p>`).join("")}</div>` : ""}
      ${avHtml}
      ${dipHtml}
      <p><strong>Fecha de inicio:</strong> ${esc(st.startDate || "—")} &nbsp; <strong>Generación:</strong> ${st.generation ? esc(st.generation) : "—"}</p>
      <div id="docs-${st.id}"><p class="muted">Cargando documentos…</p></div>
    </div>`;
  }).join("");
  if (nextClassInfo) { renderNextClassHero(); tickCountdown(); cdTimer = setInterval(tickCountdown, 1000); }
  for (const st of list) renderDocs($("docs-" + st.id), st);
}

// ---------- Mi cuenta ----------
// Cambio de contraseña propio: se re-autentica con la contraseña actual
// y luego se actualiza. La contraseña NUNCA se guarda en Firestore:
// solo se anota cuándo se cambió (passwordChangedAt) y si el admin pidió
// que se cambie (mustChangePassword). La marca se guarda en todas sus
// fichas (un alumno puede estar en varios cursos).
function fmtPassDate(v) {
  const ms = tsMillis(v);
  if (!ms) return "nunca";
  return new Date(ms).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
}
function renderAccount() {
  const s = $("section");
  const must = myEnrollments.some(d => d.mustChangePassword === true);
  const lastChange = myEnrollments.map(d => d.passwordChangedAt).find(v => v) || null;
  s.innerHTML = `
  <div class="card"><h2>Mi cuenta</h2>
    <p><strong>${esc(myName || myEmail)}</strong> · ${esc(myEmail)} · Alumno/a</p>
    <p class="muted">Último cambio de contraseña: ${fmtPassDate(lastChange)}.</p>
    ${must ? `<p class="err" style="font-weight:600">Tu contraseña fue restablecida por el administrador. Cámbiala ahora por una contraseña tuya.</p>` : ""}
  </div>
  <div class="card"><h2>Cambiar mi contraseña</h2>
    <p class="hint">Tu contraseña solo la sabes tú: el administrador no puede verla, solo puede restablecerla si la olvidas.</p>
    <div class="row">
      <div><label>Contraseña actual</label><input id="pw-cur" type="password" autocomplete="current-password"></div>
      <div><label>Contraseña nueva</label><input id="pw-new" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></div>
      <div><label>Repite la contraseña nueva</label><input id="pw-new2" type="password" autocomplete="new-password"></div>
    </div>
    <div style="margin-top:14px"><button id="btn-change-pass" class="gold">Cambiar contraseña</button> <button id="btn-back-courses" class="ghost">Volver a mis cursos</button></div>
    <div id="pw-msg" class="okmsg"></div><div id="pw-err" class="err"></div>
  </div>`;
  $("btn-back-courses").addEventListener("click", () => enterApp());
  $("btn-change-pass").addEventListener("click", async () => {
    const cur = $("pw-cur").value;
    const nw = $("pw-new").value;
    const nw2 = $("pw-new2").value;
    showErr($("pw-err"), ""); showOk($("pw-msg"), "");
    if (!cur || nw.length < 6) { showErr($("pw-err"), "Escribe tu contraseña actual y una nueva de mínimo 6 caracteres."); return; }
    if (nw !== nw2) { showErr($("pw-err"), "La contraseña nueva y su repetición no coinciden."); return; }
    $("btn-change-pass").disabled = true;
    try {
      const cred = firebase.auth.EmailAuthProvider.credential(myEmail, cur);
      await auth.currentUser.reauthenticateWithCredential(cred);
      await auth.currentUser.updatePassword(nw);
      const upd = { passwordChangedAt: firebase.firestore.FieldValue.serverTimestamp(), mustChangePassword: false };
      await Promise.all(myEnrollments.map(d => db.collection("students").doc(d.id).update(upd)));
      myEnrollments.forEach(d => { d.passwordChangedAt = new Date(); d.mustChangePassword = false; });
      showOk($("pw-msg"), "Contraseña cambiada.");
      $("pw-cur").value = ""; $("pw-new").value = ""; $("pw-new2").value = "";
      renderAccount();
    } catch (e) {
      const code = e.code || "";
      showErr($("pw-err"), code === "auth/wrong-password" || code === "auth/invalid-credential"
        ? "La contraseña actual no es correcta."
        : "No se pudo cambiar: " + (e.message || code));
    } finally { $("btn-change-pass").disabled = false; }
  });
}

// ---------- Mis documentos ----------
async function renderDocs(box, st) {
  if (!box) return;
  box.innerHTML = `<p class="muted">Cargando documentos…</p>`;
  try {
    const snap = await db.collection("students").doc(st.id).collection("docs").orderBy("uploadedAt").get();
    const docs = []; snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
    box.innerHTML = `
      <h3>Mis documentos</h3>
      ${docs.map(d => `<div class="docline"><span>${esc(d.name)}</span><span class="muted">${d.uploadedAt ? new Date(d.uploadedAt).toLocaleDateString("es-MX") : ""}${d.size ? " · " + Math.round(d.size / 1024) + " KB" : ""}</span>
        <a href="#" data-dl="${d.id}" data-path="${esc(d.path)}">Descargar</a>
        <a href="#" data-del-doc="${d.id}" data-path="${esc(d.path)}" style="color:var(--err)">Eliminar</a></div>`).join("") || `<p class="muted">Aún no has subido documentos. Sube tu INE, CURP, acta de nacimiento y comprobantes en PDF.</p>`}
      <div class="row">
        <div><label>Nombre del documento</label><input id="doc-name-${st.id}" list="doc-types-${st.id}" placeholder="Ej. INE, CURP, acta…"></div>
        <div><label>Archivo PDF (máx. ${MAX_FILE_MB} MB)</label><input id="up-${st.id}" type="file" accept="application/pdf"></div>
      </div>
      <datalist id="doc-types-${st.id}">${DOC_TYPES.map(t => `<option value="${t}">`).join("")}</datalist>
      <div style="margin-top:10px"><button class="small gold" id="btn-up-${st.id}">Subir documento</button></div>
      <div id="up-msg-${st.id}" class="okmsg"></div><div id="up-err-${st.id}" class="err"></div>`;
    box.querySelectorAll("[data-dl]").forEach(a => a.addEventListener("click", async (e) => {
      e.preventDefault();
      try { const url = await storage.ref(a.getAttribute("data-path")).getDownloadURL(); window.open(url, "_blank"); }
      catch (err) { showErr($("up-err-" + st.id), "No se pudo abrir el documento."); }
    }));
    box.querySelectorAll("[data-del-doc]").forEach(a => a.addEventListener("click", async (e) => {
      e.preventDefault();
      if (!confirm("¿Eliminar este documento?")) return;
      try {
        await storage.ref(a.getAttribute("data-path")).delete();
        await db.collection("students").doc(st.id).collection("docs").doc(a.getAttribute("data-del-doc")).delete();
        renderDocs(box, st);
      } catch (err) { showErr($("up-err-" + st.id), "No se pudo eliminar."); }
    }));
    $("btn-up-" + st.id).addEventListener("click", async () => {
      const input = $("up-" + st.id);
      const file = input.files[0];
      const docName = $("doc-name-" + st.id).value.trim() || (file ? file.name : "");
      showErr($("up-err-" + st.id), ""); showOk($("up-msg-" + st.id), "");
      if (!file) { showErr($("up-err-" + st.id), "Elige un archivo PDF primero."); return; }
      // Solo PDF: se valida aquí en el portal (las reglas de Storage no pueden
      // comprobar el tipo de contenido de forma fiable).
      if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) { showErr($("up-err-" + st.id), "Solo se aceptan archivos PDF."); return; }
      if (file.size > MAX_FILE_MB * 1024 * 1024) { showErr($("up-err-" + st.id), "El archivo es muy grande (máximo " + MAX_FILE_MB + " MB)."); return; }
      $("btn-up-" + st.id).disabled = true;
      try {
        const path = "alumnos/" + st.teacherId + "/" + st.id + "/" + Date.now() + "_" + file.name.replace(/[^A-Za-z0-9._-]/g, "_");
        await storage.ref(path).put(file);
        await db.collection("students").doc(st.id).collection("docs").add({ name: docName, path, size: file.size, uploadedAt: Date.now(), uploadedBy: myUid });
        showOk($("up-msg-" + st.id), "Documento subido.");
        renderDocs(box, st);
      } catch (err) {
        showErr($("up-err-" + st.id), "No se pudo subir el documento. Inténtalo de nuevo.");
      } finally { $("btn-up-" + st.id).disabled = false; }
    });
  } catch (e) {
    box.innerHTML = `<p class="err">No se pudieron cargar tus documentos.</p>`;
  }
}
</script>
