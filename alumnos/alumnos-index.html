function cacheKey(name) {
  // La clave lleva el usuario para que dos cuentas en el mismo
  // navegador no se mezclen los datos.
  return "gecatechCache:" + (myUid || "anon") + ":" + name;
}
function cacheGet(name, ttlMs) {
  try {
    const raw = localStorage.getItem(cacheKey(name));
    if (!raw) return null;
    const entry = JSON.parse(raw);
    if (!entry || typeof entry.at !== "number" || Date.now() - entry.at > ttlMs) return null;
    return entry.value;
  } catch (e) { return null; }
}
function cacheSet(name, value) {
  try {
    localStorage.setItem(cacheKey(name), JSON.stringify({ at: Date.now(), value: value }));
  } catch (e) { /* almacenamiento lleno o bloqueado: se ignora */ }
}
function cacheDel(name) {
  try { localStorage.removeItem(cacheKey(name)); } catch (e) {}
}

// ---------- Mis cursos ----------
async function loadEnrollments() {
  // Solo trae las fichas vinculadas a esta cuenta (authUid == mi uid).
  const snap = await db.collection("students").where("authUid", "==", myUid).get();
  const list = [];
  snap.forEach(d => { const data = d.data(); if (data.active !== false) list.push({ id: d.id, ...data }); });
  list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  // Los cursos son independientes: se leen en paralelo (antes, uno
  // tras otro en serie).
  const courseIds = [...new Set(list.map(s => s.courseId))].filter(Boolean);
  const courseDocs = await Promise.all(courseIds.map(cid => db.collection("courses").doc(cid).get()));
  const courses = {};
  courseDocs.forEach((doc, i) => { if (doc.exists) courses[courseIds[i]] = doc.data(); });
  return { list, courses };
}
// Normaliza una fecha a "YYYY-MM-DD" para poder compararla. "" si no se puede.
function normDate(d) {
  if (!d) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d).trim());
  if (m) return m[1] + "-" + m[2] + "-" + m[3];
  const dt = new Date(d);
  if (isNaN(dt)) return "";
  const p = n => String(n).padStart(2, "0");
  return dt.getFullYear() + "-" + p(dt.getMonth() + 1) + "-" + p(dt.getDate());
}
function fmtRecDate(d) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || "");
  if (!m) return d || "";
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
}
// createdAt puede ser Timestamp de servidor, número o null: normalizar a ms.
function tsMillis(v) {
  if (!v) return 0;
  if (typeof v.toMillis === "function") return v.toMillis();
  if (typeof v === "number") return v;
  const d = new Date(v);
  return isNaN(d) ? 0 : d.getTime();
}
function fmtAvDate(v) {
  const ms = tsMillis(v);
  if (!ms) return "";
  return new Date(ms).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
}
// ¿Hoy es día de clase de este curso? Busca el día de la semana en el horario
// ("Martes 8-10 p. m.", "Lunes y Miércoles…"). "Varios horarios" no tiene un
// único día, así que no muestra la banda.
function isClassToday(schedule) {
  const days = ["domingo", "lunes", "martes", "miercoles", "jueves", "viernes", "sabado"];
  const norm = String(schedule || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const found = norm.match(/\b(domingo|lunes|martes|miercoles|jueves|viernes|sabado)\b/g) || [];
  return found.includes(days[new Date().getDay()]);
}

// Fecha "YYYY-MM-DD" a ms (inicio del día local). 0 si no se puede leer.
function newsDateMs(dateStr) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr || ""));
  if (!m) return 0;
  return new Date(+m[1], +m[2] - 1, +m[3], 0, 0, 0).getTime();
}
// ¿La novedad es de los últimos 14 días? (hoy sí; una fecha futura, no).
function isNewsNew(dateStr, nowMs) {
  const ms = newsDateMs(dateStr);
  if (!ms) return false;
  const now = typeof nowMs === "number" ? nowMs : Date.now();
  return ms <= now && (now - ms) < 14 * 24 * 60 * 60 * 1000;
}
// Novedades para una audiencia ("maestros" o "alumnos"), de la más
// reciente a la más antigua. No muta el arreglo original.
function newsForAudience(list, audience) {
  return (list || []).filter(n => n && (n.audience === audience || n.audience === "ambos"))
    .map((n, i) => ({ n, i }))
    .sort((a, b) => (newsDateMs(b.n.date) - newsDateMs(a.n.date)) || (a.i - b.i))
    .map(x => x.n);
}

}

// ---------- Mi próxima clase ----------
// Saca los días y la hora de inicio del horario del alumno
// ("Martes 8-10 p. m.", "Lunes 9:30-11:30 p. m.", "Martes 20:00–22:00").
// null si el horario no tiene día ni hora claros ("Varios horarios").
const WEEKDAYS = { domingo: 0, lunes: 1, martes: 2, miercoles: 3, jueves: 4, viernes: 5, sabado: 6 };
function parseSchedule(schedule) {
  const norm = String(schedule || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const dayNames = norm.match(/\b(domingo|lunes|martes|miercoles|jueves|viernes|sabado)\b/g) || [];
  if (!dayNames.length) return null;
  const days = [...new Set(dayNames.map(d => WEEKDAYS[d]))];
  const t = norm.replace(/[–—]/g, "-").replace(/\./g, "").replace(/\bp\s*m\b/g, "pm").replace(/\ba\s*m\b/g, "am");
  const m = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*-\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/.exec(t);
  if (!m) return null;
  let h1 = +m[1];
  const min1 = m[2] ? +m[2] : 0;
  const ap = m[3] || m[6] || null;
  if (ap === "pm" && h1 < 12) h1 += 12;
  if (ap === "am" && h1 === 12) h1 = 0;
  if (h1 > 23) return null;
  return { days, hour: h1, minute: min1 };
}
// La siguiente fecha/hora en que toca clase según el horario, desde `from`.
function nextOccurrence(sched, from) {
  let best = null;
  for (const d of sched.days) {
    const t = new Date(from.getFullYear(), from.getMonth(), from.getDate(), sched.hour, sched.minute, 0);
    t.setDate(t.getDate() + ((d - from.getDay() + 7) % 7));
    if (t <= from) t.setDate(t.getDate() + 7);
    if (!best || t < best) best = t;
  }
  return best;
}
// La próxima clase entre todos los cursos del alumno (la más cercana).
function buildNextClass(list, courses) {
  const now = new Date();
  let best = null;
  for (const st of list) {
    const course = courses[st.courseId] || {};
    const sched = parseSchedule((st.classLabel || "").trim() || course.schedule);
    if (!sched) continue;
    const target = nextOccurrence(sched, now);
    if (!target) continue;
    if (!best || target < best.target) best = { st, course, sched, target };
  }
  return best;
}
let cdTimer = null;
let nextClassInfo = null;
function stopCountdown() { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } }
function tickCountdown() {
  const info = nextClassInfo;
  if (!info) return;
  const el = (id) => document.getElementById(id);
  if (!el("cd-d")) { stopCountdown(); return; }
  let diff = info.target - new Date();
  if (diff <= 0) { // la clase ya empezó: la cuenta regresiva pasa a la siguiente
    info.target = nextOccurrence(info.sched, new Date());
    diff = info.target - new Date();
  }
  el("cd-d").textContent = Math.floor(diff / 864e5);
  el("cd-h").textContent = Math.floor(diff / 36e5) % 24;
  el("cd-m").textContent = Math.floor(diff / 6e4) % 60;
  el("cd-s").textContent = Math.floor(diff / 1e3) % 60;
}

// ---------- Material de clase (Classroom) ----------
// El material se pide al servidor con la función getStudentCourseMaterials:
// el navegador nunca habla directo con classroom.googleapis.com y nunca
// recibe calificaciones ni entregas, solo temas y materiales. El material
// se filtra por materia de entrada (ver materialFilterFor): cada alumno ve
// solo desde la materia en la que entró, hacia adelante; lo anterior queda
// oculto y lo nuevo aparece conforme se publica. Las presentaciones que el
// maestro publica en Classroom como material (Drive, enlace o video) llegan
// aquí igual que cualquier material: no hay que subirlas en el portal.
// El botón queda siempre visible para reintentar tras un error.
function materialLinksOf(m) {
  const out = [];
  (Array.isArray(m.materials) ? m.materials : []).forEach(att => {
    if (att.driveFile && att.driveFile.driveFile) {
      const f = att.driveFile.driveFile;
      out.push({ url: f.alternateLink || "", label: f.title || "Archivo de Drive" });
    } else if (att.link) {
      out.push({ url: att.link.url || "", label: att.link.title || att.link.url || "Enlace" });
    } else if (att.youtubeVideo) {
      out.push({ url: att.youtubeVideo.alternateLink || "", label: att.youtubeVideo.title || "Video de YouTube" });
    } else if (att.form) {
      out.push({ url: att.form.formUrl || "", label: att.form.title || "Formulario" });
    }
  });
  return out.filter(l => l.url);
}
function renderMaterialsHtml(data, filter) {
  const topics = Array.isArray(data.topics) ? data.topics : [];
  const materials = Array.isArray(data.materials) ? data.materials : [];
  if (!materials.length) return `<p class="muted">Tu maestro aún no ha publicado material en Classroom.</p>`;
  let list = materials;
  if (filter) {
    list = materials.filter(m => {
      const c = classifyMaterialModule(m, topics, filter.syllabus);
      if (c.kind === "temario") return false;
      if (c.kind === "general") return true;
      return c.idx >= filter.entryModuleIdx && c.idx <= filter.currentModuleIdx;
    });
    if (!list.length) return `<p class="muted">Todavía no hay material de tu materia en el portal. Cuando tu maestro publique material de la materia que estás tomando, aparecerá aquí.</p>`;
  }
  const byTopic = {};
  const general = [];
  list.forEach(m => {
    const tid = m.topicId || "";
    if (tid && topics.some(t => t.topicId === tid)) (byTopic[tid] = byTopic[tid] || []).push(m);
    else general.push(m);
  });
  const matHtml = (m) => {
    const links = materialLinksOf(m);
    return `<p><strong>${esc(m.title || "Material")}</strong>${m.updateTime ? ` <span class="muted">${fmtAvDate(m.updateTime)}</span>` : ""}${m.description ? `<br>${esc(m.description)}` : ""}${links.length ? `<br>` + links.map(l => `<a target="_blank" rel="noopener" href="${esc(l.url)}">${esc(l.label)}</a>`).join(" · ") : ""}</p>`;
  };
  let html = "";
  topics.forEach(t => {
    const list = byTopic[t.topicId] || [];
    if (!list.length) return;
    html += `<h3 style="font-size:15px">${esc(t.name)}</h3>` + list.map(matHtml).join("");
  });
  if (general.length) html += `<h3 style="font-size:15px">Material general</h3>` + general.map(matHtml).join("");
  return html;
}
function renderMaterialsResult(st, d) {
  const box = $("mat-box-" + st.id);
  if (!box) return;
  if (!d.connected) {
    box.innerHTML = `<p class="muted">${d.reason === "no-classroom" ? "Este curso aún no tiene Classroom enlazado. Pídele a tu maestro que lo enlace." : "Tu maestro aún no conectó su Classroom."}</p>`;
    return;
  }
  const filter = materialFilterFor(st.courseId, coursesById[st.courseId] || {}, st);
  box.innerHTML = (filter && filter.entryModuleIdx > 0 ? `<p class="muted">Material desde la materia ${esc(filter.entryModuleTitle)} en adelante.</p>` : "") + renderMaterialsHtml(d, filter);
}
function renderMaterialsError(st, code) {
  const box = $("mat-box-" + st.id);
  if (!box) return;
  // El servidor distingue el motivo: failed-precondition = Classroom
  // no dio permiso (el maestro debe reconectar su Classroom);
  // not-found = el curso no existe en Classroom. Lo demás es el
  // mensaje genérico con reintento.
  if (String(code || "").includes("failed-precondition")) {
    box.innerHTML = `<p class="err">Classroom no dio permiso para ver el material. Pídele a tu maestro que desconecte y vuelva a conectar su Classroom en Mi cuenta.</p>`;
  } else if (String(code || "").includes("not-found")) {
    box.innerHTML = `<p class="err">El curso no se encontró en Classroom. Pídele a tu maestro que revise el enlace de Classroom del curso.</p>`;
  } else {
    box.innerHTML = `<p class="err">No se pudo cargar el material. Inténtalo de nuevo.</p>`;
  }
}
// Pide el material al servidor y lo guarda: solo se guarda el éxito con
// Classroom conectado; un "no conectado" no se guarda (cambia cuando el
// maestro conecta) y un error se guarda aparte, 5 minutos.
async function fetchMaterials(st) {
  const fn = firebase.functions().httpsCallable("getStudentCourseMaterials");
  const r = await fn({ studentId: st.id });
  const d = r.data || {};
  if (d.connected) cacheSet("mat-" + st.id, d);
  return d;
}
async function refreshMaterialsInBackground(st) {
  try {
    const d = await fetchMaterials(st);
    cacheDel("mat-err-" + st.id);
    renderMaterialsResult(st, d);
  } catch (e) {
    const code = String((e && e.code) || "");
    cacheSet("mat-err-" + st.id, { code: code });
    renderMaterialsError(st, code);
  }
}
async function loadStudentMaterials(st) {
  const box = $("mat-box-" + st.id);
  const btn = $("btn-mat-" + st.id);
  if (!box || !btn) return;
  // Lo último guardado se muestra al instante; el refresco corre
  // detrás y actualiza la caja si el alumno sigue viéndola.
  const cached = cacheGet("mat-" + st.id, 30 * 60 * 1000);
  if (cached) {
    renderMaterialsResult(st, cached);
    refreshMaterialsInBackground(st);
    return;
  }
  const cachedErr = cacheGet("mat-err-" + st.id, 5 * 60 * 1000);
  if (cachedErr) {
    renderMaterialsError(st, cachedErr.code || "");
    refreshMaterialsInBackground(st);
    return;
  }
  box.innerHTML = `<p class="muted">Cargando material…</p>`;
  btn.disabled = true;
  try {
    const d = await fetchMaterials(st);
    renderMaterialsResult(st, d);
  } catch (e) {
    const code = String((e && e.code) || "");
    cacheSet("mat-err-" + st.id, { code: code });
    renderMaterialsError(st, code);
  } finally {
    btn.disabled = false;
  }
}
function prefetchMaterials(st) {
  // Después de pintar los cursos: calienta la llamada para que el
  // primer clic sea instantáneo. No toca la pantalla.
  fetchMaterials(st).catch(() => {});
}
function setupMaterialBlock(st) {
  const btn = $("btn-mat-" + st.id);
  if (!btn) return;
  btn.addEventListener("click", () => loadStudentMaterials(st));
}

// ---------- Mis tareas (Classroom) ----------
// Las tareas se piden al servidor con getStudentClassroomWork: el
// navegador nunca habla directo con classroom.googleapis.com y solo
// recibe las tareas PUBLICADAS con la entrega de ESE alumno (nunca las
// de otros alumnos). Las tareas no son avance del curso: título, fecha
// de entrega y estado sí se muestran; la semana del curso nunca aparece
// aquí. El botón queda siempre visible para reintentar tras un error.
const MESES_CORTOS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
function fmtWorkDue(w) {
  const d = w.dueDate || null;
  if (!d || !d.year || !d.month || !d.day) return "";
  let s = d.day + " " + (MESES_CORTOS[d.month - 1] || "") + " " + d.year;
  const t = w.dueTime || null;
  if (t && t.hours != null) s += " " + String(t.hours).padStart(2, "0") + ":" + String(t.minutes || 0).padStart(2, "0");
  return s;
}
function workDueMillis(w) {
  const d = w.dueDate || null;
  if (!d || !d.year || !d.month || !d.day) return Infinity;
  const t = w.dueTime || {};
  return new Date(d.year, d.month - 1, d.day, t.hours || 0, t.minutes || 0).getTime();
}
function sortWorksByDue(list) {
  return (list || []).slice().sort((a, b) => workDueMillis(a) - workDueMillis(b));
}
function workStatusChip(w) {
  // Calificada manda sobre el estado: una tarea devuelta con nota es
  // calificada. Sin entrega en Classroom, la tarea está pendiente.
  if (w.assignedGrade != null) return { label: "Calificada", bg: "#d9f2dd", fg: "#1d5c2e" };
  const s = w.submissionState || "";
  if (s === "TURNED_IN") return { label: "Entregada", bg: "#dcebf7", fg: "#0b2a4a" };
  if (s === "RETURNED") return { label: "Devuelta", bg: "#f3d9d9", fg: "#7a1f1f" };
  if (s === "RECLAIMED_BY_STUDENT") return { label: "Sin entregar", bg: "#eee", fg: "#555" };
  return { label: "Pendiente", bg: "#fdeecb", fg: "#7a5c00" };
}
function renderWorksHtml(data) {
  const works = sortWorksByDue(Array.isArray(data.works) ? data.works : []);
  if (!works.length) return `<p class="muted">Tu maestro aún no ha publicado tareas en Classroom.</p>`;
  return works.map(w => {
    const chip = workStatusChip(w);
    const due = fmtWorkDue(w);
    const grade = (w.assignedGrade != null)
      ? `<br><strong>Calificación:</strong> ${w.assignedGrade}${w.maxPoints != null ? "/" + w.maxPoints : ""}`
      : "";
    // Archivos que el alumno entregó en esta tarea (los devuelve la
    // función getStudentClassroomWork) y su respuesta corta, si la hay.
    // materialLinksOf sirve para estos adjuntos: tienen la misma forma
    // que los materiales de Classroom.
    const myLinks = materialLinksOf({ materials: Array.isArray(w.attachments) ? w.attachments : [] });
    const shortAns = typeof w.shortAnswer === "string" ? w.shortAnswer.trim() : "";
    const myFiles = (myLinks.length ? `<br><strong>Mis archivos entregados:</strong> ` + myLinks.map(l => `<a target="_blank" rel="noopener" href="${esc(l.url)}">${esc(l.label)}</a>`).join(" · ") : "") + (shortAns ? `<br><strong>Mi respuesta:</strong> ${esc(shortAns)}` : "");
    return `<p><strong>${esc(w.title || "Tarea")}</strong> <span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:${chip.bg};color:${chip.fg}">${chip.label}</span><br><span class="muted">Fecha de entrega: ${due ? esc(due) : "Sin fecha de entrega"}</span>${w.description ? `<br>${esc(w.description)}` : ""}${grade}${myFiles}${w.alternateLink ? `<br><a target="_blank" rel="noopener" href="${esc(w.alternateLink)}">Abrir en Classroom</a>` : ""}</p>`;
  }).join("");
}
function renderWorksResult(st, d) {
  const box = $("work-box-" + st.id);
  if (!box) return;
  if (!d.connected) {
    box.innerHTML = `<p class="muted">${d.reason === "no-classroom" ? "Este curso aún no tiene Classroom enlazado." : "Tu maestro aún no conectó su Classroom."}</p>`;
    return;
  }
  if (!d.matched) {
    box.innerHTML = `<p class="muted">No se encontró tu entrega en Classroom con tu nombre; pídele a tu maestro que revise tu nombre en Classroom.</p>`;
    return;
  }
  box.innerHTML = renderWorksHtml(d);
}
// Pide las tareas al servidor y las guarda: solo se guarda el éxito con
// Classroom conectado y alumno emparejado; lo demás no se guarda.
async function fetchWork(st) {
  const fn = firebase.functions().httpsCallable("getStudentClassroomWork");
  const r = await fn({ studentId: st.id });

async function refreshWorkInBackground(st) {

async function loadStudentWork(st) {

// ---------- Preguntar a mi maestro ----------
// El alumno escribe su pregunta directo en la colección `questions` (sin
// pasar por el servidor): el documento lleva studentAuthUid denormalizado
// para que las reglas puedan filtrar sin get() anidados en la consulta.
// Sin orderBy (evita necesitar un índice compuesto): se ordena en el
// cliente por fecha descendente. La pregunta y su respuesta son lo único
// que ve el alumno en este bloque.
const MAX_QUESTION_LEN = 1000;
function sortQuestionsDesc(list) {
  return [...list].sort((a, b) => tsMillis(b.createdAt) - tsMillis(a.createdAt));
}
function questionStatusChip(q) {
  return q.status === "respondida"
    ? `<span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#dcebf7;color:#0b2a4a">Respondida</span>`
    : `<span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#c9a227;color:#fff">Pendiente</span>`;
}
function renderQuestionsHtml(list) {
  if (!list.length) return `<p class="muted">Aún no has hecho preguntas en este curso.</p>`;
  return list.map(q => `<p><strong>${esc(q.text || "")}</strong> ${questionStatusChip(q)} <span class="muted">${fmtAvDate(q.createdAt)}</span>${q.status === "respondida" && (q.answer || "").trim() ? `<br><strong>Respuesta de tu maestro:</strong> ${esc(q.answer)}${q.answeredAt ? ` <span class="muted">${fmtAvDate(q.answeredAt)}</span>` : ""}` : ""}</p>`).join("");
}
async function loadStudentQuestions(st) {
  const box = $("q-list-" + st.id);
  if (!box) return;
  try {
    // Las reglas de `questions` solo dejan leer documentos con
    // studentAuthUid == tu uid: la consulta DEBE filtrar por ese campo
    // (las reglas no filtran, así que una consulta por studentId se
    // rechaza con permiso denegado aunque las preguntas sí sean tuyas).
    // El filtro por curso se hace en el cliente.
    const snap = await db.collection("questions").where("studentAuthUid", "==", myUid).get();
    const arr = []; snap.forEach(d => { const q = { id: d.id, ...d.data() }; if (q.studentId === st.id) arr.push(q); });
    box.innerHTML = renderQuestionsHtml(sortQuestionsDesc(arr));
  } catch (e) {
    box.innerHTML = `<p class="err">No se pudieron cargar tus preguntas. Inténtalo de nuevo.</p>`;
  }
}
async function sendStudentQuestion(st) {
  const ta = $("q-text-" + st.id);
  const btn = $("btn-q-" + st.id);
  if (!ta || !btn) return;
  const text = ta.value.trim();
  showErr($("q-err-" + st.id), ""); showOk($("q-msg-" + st.id), "");
  if (!text) { showErr($("q-err-" + st.id), "Escribe tu pregunta antes de enviarla."); return; }
  if (text.length > MAX_QUESTION_LEN) { showErr($("q-err-" + st.id), "Tu pregunta no puede pasar de 1000 caracteres."); return; }
  btn.disabled = true;
  try {
    await db.collection("questions").add({
      studentId: st.id,
      studentName: myName || "",
      studentAuthUid: myUid || "",
      teacherId: st.teacherId || "",
      courseId: st.courseId || "",
      text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      status: "pendiente",
      answer: "",
      answeredAt: null,
      answeredBy: ""
    });
    ta.value = "";
    const cnt = $("q-count-" + st.id); if (cnt) cnt.textContent = "0";
    showOk($("q-msg-" + st.id), "Pregunta enviada. Tu maestro te responderá aquí mismo.");
    await loadStudentQuestions(st);
  } catch (e) {
    showErr($("q-err-" + st.id), "No se pudo enviar tu pregunta. Inténtalo de nuevo.");
  } finally { btn.disabled = false; }
}
function setupQuestionsBlock(st) {
  const btn = $("btn-q-" + st.id);
  const ta = $("q-text-" + st.id);
  if (!btn || !ta) return;
  ta.addEventListener("input", () => { const c = $("q-count-" + st.id); if (c) c.textContent = String(ta.value.length); });
  btn.addEventListener("click", () => sendStudentQuestion(st));
  loadStudentQuestions(st);
}

    const nw2 = $("pw-new2").value;
    showErr($("pw-err"), ""); showOk($("pw-msg"), "");

      await Promise.all(myEnrollments.map(d => db.collection("students").doc(d.id).update(upd)));

// ---------- Mis pagos ----------
// El alumno paga por transferencia bancaria y sube la foto del

function flattenSyllabus(syllabus) {

  for (let t = topicIdx - 1; t >= 0; t--) {

// entrada se deriva de la semana de entrada del alumno (su fecha de
// inicio contra el inicio del curso); el módulo actual, de la semana

// semanas pagables: inicio del curso + pasos de 7 días.
function entryWeek1Based(courseStart, studentStart) {
  const cs = String(courseStart || "").slice(0, 10);
  const ss = String(studentStart || "").slice(0, 10);
  const csMs = ymdMillis(cs);

// Índice del módulo al que pertenece un nombre de tema de Classroom

  let i = norms.indexOf(nt);
  if (i >= 0) return i;
  for (let k = 0; k < norms.length; k++) {
    if (norms[k] && (norms[k].includes(nt) || nt.includes(norms[k]))) return k;
  }
  const words = nt.split(" ").filter(w => w.length > 2);
  if (words.length) {

// Clasifica un material de Classroom a un módulo del temario:

// PRIMERO por el nombre del tema de Classroom; SEGUNDO por el prefijo
// numérico del título combinado con el tema (el número solo no basta:
// en Administrativo el 1.1 se repite entre módulos). Sin tema que case
// y sin número: "Material general", que sigue visible (Reglamento,

function classifyMaterialModule(m, topics, syllabus) {
  const title = (m && m.title) || "";

  const modules = (Array.isArray(syllabus) ? syllabus : []).map(x => (x && x.title) || "");

// Filtro de material para un alumno: { syllabus, entryModuleIdx,

// se puede filtrar (sin temario o sin fecha de ingreso definible): en

  const same = (list || []).filter(p => p && p.receiptHash === hash);
  if (same.some(p => p.status === "confirmado")) return { ok: false, error: "Este comprobante ya se usó en un pago confirmado (pagado). No se puede volver a usar." };
  if (same.some(p => p.status === "pendiente")) return { ok: false, error: "Este comprobante ya está en revisión en otro pago. Espera a que tu maestro lo revise." };
  const todayCount = same.filter(p => dayYMDChihuahua(tsMillis(p.createdAt)) === today).length;
  if (todayCount >= 3) return { ok: false, error: "Este comprobante ya se envió 3 veces hoy, inténtalo mañana." };
  return { ok: true, error: "" };
}
function sortPaymentsDesc(list) {
  return [...list].sort((a, b) => tsMillis(b.createdAt) - tsMillis(a.createdAt));
}
function paymentStatusChip(p) {
  if (p.status === "confirmado") return `<span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#e3f0d3;color:#4a7003">Pagado</span>`;
  if (p.status === "rechazado") return `<span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#fbe3e1;color:#d41c14">Rechazado</span>`;
  return `<span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#c9a227;color:#fff">En revisión</span>`;
}
// Resumen de pagos: semanas pagadas, en revisión y rechazadas con motivo.
function renderPaymentsHtml(list) {
  if (!list.length) return `<p class="muted">Aún no has enviado comprobantes en este curso.</p>`;
  const paid = [], pending = [], rejected = [];
  list.forEach(p => { (p.status === "confirmado" ? paid : p.status === "rechazado" ? rejected : pending).push(p); });
  const weeksOf = arr => arr.flatMap(p => p.weeks || []).sort((a, b) => a - b);
  const paidWeeks = weeksOf(paid);
  const pendingWeeks = weeksOf(pending);
  let html = `<p><strong>Semanas pagadas:</strong> ${paidWeeks.length ? esc(paidWeeks.join(", ")) : "ninguna todavía"}</p>`;
  if (pendingWeeks.length) html += `<p><strong>En revisión:</strong> semanas ${esc(pendingWeeks.join(", "))} — tu maestro está revisando tu comprobante.</p>`;
  html += list.map(p => {
    const weeks = (p.weeks || []).slice().sort((a, b) => a - b);
    return `<p>Semanas ${weeks.length ? esc(weeks.join(", ")) : "—"} · $${esc(p.amount)} · ${esc(p.receiptDate || "—")} ${paymentStatusChip(p)} <span class="muted">${fmtAvDate(p.createdAt)}</span>${p.status === "rechazado" && p.rejectReason ? `<br>Motivo del rechazo: ${esc(p.rejectReason)}` : ""}</p>`;
  }).join("");
  return html;
}
async function loadStudentPayments(st) {
  const box = $("pay-list-" + st.id);
  if (!box) return [];
  try {
    // Sin orderBy (evita necesitar un índice compuesto): se ordena en el
    // cliente por fecha descendente, como las preguntas y los avisos.
    const snap = await db.collection("students").doc(st.id).collection("payments").get();
    const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    const sorted = sortPaymentsDesc(arr);
    box.innerHTML = renderPaymentsHtml(sorted);
    return sorted;
  } catch (e) {
    box.innerHTML = `<p class="err">No se pudieron cargar tus pagos. Inténtalo de nuevo.</p>`;
    return [];
  }
}
async function setupPaymentsBlock(st, course) {
  const box = $("pay-list-" + st.id);
  const form = $("pay-form-" + st.id);
  if (!box || !form) return;
  const calendar = buildWeekCalendar(st.courseId, (course && course.syllabus) || []);
  const payments = await loadStudentPayments(st);
  const blocked = new Set();
  payments.forEach(p => { if (p.status === "confirmado" || p.status === "pendiente") (p.weeks || []).forEach(w => blocked.add(w)); });
  const weeks = payableWeeks({ courseStart: (course && course.startDate) || st.startDate || "", totalWeeks: calendar.length, studentStart: st.startDate || "", today: todayYMD(), blockedWeeks: [...blocked] });
  const listEl = $("pay-weeks-" + st.id);
  const totalEl = $("pay-total-" + st.id);
  const getSelected = () => [...form.querySelectorAll("input[data-pay-week]:checked")].map(cb => ({ week: +cb.getAttribute("data-pay-week"), date: cb.getAttribute("data-pay-date"), price: +cb.getAttribute("data-pay-price") }));
  const updateTotal = () => {
    const sel = getSelected();
    totalEl.textContent = sel.length ? "Total a pagar: $" + computeTotal(sel) : "Elige las semanas que vas a pagar.";
    return sel;
  };
  if (!weeks.length) {
    listEl.innerHTML = `<p class="muted">Por ahora no hay semanas por pagar en este curso: las semanas con fecha hasta hoy ya están pagadas o en revisión, o el curso aún no tiene fecha de inicio registrada.</p>`;
  } else {
    listEl.innerHTML = weeks.map(w => `<label style="display:block;font-weight:400;color:var(--text);margin:6px 0"><input type="checkbox" style="width:auto" data-pay-week="${w.week}" data-pay-date="${w.date}" data-pay-price="${w.price}"> Semana ${w.week} — ${fmtRecDate(w.date)} — $${w.price}</label>`).join("");
    listEl.querySelectorAll("input[data-pay-week]").forEach(cb => cb.addEventListener("change", updateTotal));
  }
  updateTotal();
  const btn = $("btn-pay-" + st.id);
  if (btn) btn.addEventListener("click", () => sendStudentPayment(st, { getSelected, refresh: () => setupPaymentsBlock(st, course) }));
}
async function sendStudentPayment(st, ctx) {
  const errEl = $("pay-err-" + st.id), msgEl = $("pay-msg-" + st.id), warnEl = $("pay-warn-" + st.id);
  const btn = $("btn-pay-" + st.id);
  if (!btn) return;
  showErr(errEl, ""); showOk(msgEl, ""); if (warnEl) warnEl.textContent = "";
  const selected = ctx.getSelected();
  const amount = $("pay-amount-" + st.id).value.trim();
  const receiptDate = $("pay-date-" + st.id).value;
  const file = $("pay-file-" + st.id).files[0];
  const v = validatePayment({ selectedWeeks: selected, amount, receiptDate, today: todayYMD() });
  if (!v.ok) { showErr(errEl, v.error); return; }
  if (v.warning && warnEl) warnEl.textContent = v.warning;
  if (!file) { showErr(errEl, "Elige la foto o PDF de tu comprobante."); return; }
  const okType = file.type.startsWith("image/") || file.type === "application/pdf" || /\.(pdf|jpg|jpeg|png|webp|heic)$/i.test(file.name);
  if (!okType) { showErr(errEl, "El comprobante debe ser una imagen o un PDF."); return; }
  if (file.size > MAX_RECEIPT_MB * 1024 * 1024) { showErr(errEl, "El comprobante es muy grande (máximo " + MAX_RECEIPT_MB + " MB)."); return; }
  if (!st.teacherId) { showErr(errEl, "Tu ficha no tiene maestro asignado. Avísale al administrador."); return; }
  btn.disabled = true;
  try {
    // El comprobante no debe haberse usado en un pago confirmado o en
    // revisión, ni haberse enviado 3 veces hoy: se compara su huella
    // con los pagos que ya tiene esta ficha.
    const hash = await receiptHashOf(file);
    const existing = await loadStudentPayments(st);
    const reuse = checkReceiptReuse(existing, hash, dayYMDChihuahua(Date.now()));
    if (!reuse.ok) { showErr(errEl, reuse.error); return; }
    // Ruta PLANA bajo alumnos/{teacherId}/{studentId}/ (sin subcarpeta):
    // la regla existente `match /alumnos/{teacherId}/{studentId}/{fileName}`
    // solo cubre un segmento de nombre, así que no hace falta cambiar
    // storage.rules. Igual que los documentos del alumno.
    const path = "alumnos/" + st.teacherId + "/" + st.id + "/comprobante_" + Date.now() + "_" + file.name.replace(/[^A-Za-z0-9._-]/g, "_");
    await storage.ref(path).put(file);
    await db.collection("students").doc(st.id).collection("payments").add({
      studentId: st.id,
      studentName: myName || "",
      studentAuthUid: myUid || "",
      teacherId: st.teacherId || "",
      courseId: st.courseId || "",
      weeks: selected.map(w => w.week),
      amount: Number(amount),
      receiptPath: path,
      receiptHash: hash,
      receiptDate,
      status: "pendiente",
      rejectReason: "",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showOk(msgEl, "Comprobante enviado. Tu maestro lo revisará y te confirmará aquí mismo.");
    await ctx.refresh();
  } catch (e) {
    showErr(errEl, "No se pudo enviar tu comprobante. Inténtalo de nuevo.");
  } finally { btn.disabled = false; }
}

// ---------- Mis documentos ----------
async function renderDocs(box, st) {
  if (!box) return;
  box.innerHTML = `<p class="muted">Cargando documentos…</p>`;
  try {
    const snap = await db.collection("students").doc(st.id).collection("docs").orderBy("uploadedAt").get();
    const docs = []; snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
    box.innerHTML = `
      <h3>Mis documentos</h3>
      ${docs.map(d => `<div class="docline"><span>${esc(d.name)}</span><span class="muted">${d.uploadedAt ? new Date(d.uploadedAt).toLocaleDateString("es-MX") : ""}${d.size ? " · " + Math.round(d.size / 1024) + " KB" : ""}</span>
        <button type="button" class="small ghost" data-dl="${d.id}" data-path="${esc(d.path)}">Descargar</button>
        <button type="button" class="small ghost" data-del-doc="${d.id}" data-path="${esc(d.path)}" style="color:var(--err)">Eliminar</button></div>`).join("") || `<p class="muted">Aún no has subido documentos. Sube tu INE, CURP, acta de nacimiento y comprobantes en PDF.</p>`}
      <div class="row">
        <div><label>Nombre del documento</label><input id="doc-name-${st.id}" list="doc-types-${st.id}" placeholder="Ej. INE, CURP, acta…"></div>
        <div><label>Archivo PDF (máx. ${MAX_FILE_MB} MB)</label><input id="up-${st.id}" type="file" accept="application/pdf"></div>
      </div>
      <datalist id="doc-types-${st.id}">${DOC_TYPES.map(t => `<option value="${t}">`).join("")}</datalist>
      <div style="margin-top:10px"><button class="small gold" id="btn-up-${st.id}">Subir documento</button></div>
      <div id="up-msg-${st.id}" class="okmsg"></div><div id="up-err-${st.id}" class="err"></div>`;
    box.querySelectorAll("[data-dl]").forEach(a => a.addEventListener("click", async (e) => {
      e.preventDefault();
      try { const url = await storage.ref(a.getAttribute("data-path")).getDownloadURL(); window.open(url, "_blank"); }
      catch (err) { showErr($("up-err-" + st.id), "No se pudo abrir el documento."); }
    }));
    box.querySelectorAll("[data-del-doc]").forEach(a => a.addEventListener("click", async (e) => {
      e.preventDefault();
      if (!confirm("¿Eliminar este documento?")) return;
      try {
        await storage.ref(a.getAttribute("data-path")).delete();
        await db.collection("students").doc(st.id).collection("docs").doc(a.getAttribute("data-del-doc")).delete();
        renderDocs(box, st);
      } catch (err) { showErr($("up-err-" + st.id), "No se pudo eliminar."); }
    }));
    $("btn-up-" + st.id).addEventListener("click", async () => {
      const input = $("up-" + st.id);
      const file = input.files[0];
      const docName = $("doc-name-" + st.id).value.trim() || (file ? file.name : "");
      showErr($("up-err-" + st.id), ""); showOk($("up-msg-" + st.id), "");
      if (!file) { showErr($("up-err-" + st.id), "Elige un archivo PDF primero."); return; }
      // Solo PDF: se valida aquí en el portal (las reglas de Storage no pueden
      // comprobar el tipo de contenido de forma fiable).
      if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) { showErr($("up-err-" + st.id), "Solo se aceptan archivos PDF."); return; }
      if (file.size > MAX_FILE_MB * 1024 * 1024) { showErr($("up-err-" + st.id), "El archivo es muy grande (máximo " + MAX_FILE_MB + " MB)."); return; }
      $("btn-up-" + st.id).disabled = true;
      try {
        const path = "alumnos/" + st.teacherId + "/" + st.id + "/" + Date.now() + "_" + file.name.replace(/[^A-Za-z0-9._-]/g, "_");
        await storage.ref(path).put(file);
        await db.collection("students").doc(st.id).collection("docs").add({ name: docName, path, size: file.size, uploadedAt: Date.now(), uploadedBy: myUid });
        showOk($("up-msg-" + st.id), "Documento subido.");
        renderDocs(box, st);
      } catch (err) {
        showErr($("up-err-" + st.id), "No se pudo subir el documento. Inténtalo de nuevo.");
      } finally { $("btn-up-" + st.id).disabled = false; }
    });
  } catch (e) {
    box.innerHTML = `<p class="err">No se pudieron cargar tus documentos.</p>`;
  }
}
</script>
